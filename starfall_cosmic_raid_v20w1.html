<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02040b">
<title>STARFALL // COSMIC RAID</title>
<style>
  :root{--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040b;color:#dff8ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
  body{position:fixed;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
  #hud{position:absolute;inset:0;pointer-events:none;padding:calc(7px + var(--safe-top)) 7px calc(7px + var(--safe-bottom));display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 2px 8px #000}
  .topbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;width:min(100%,420px);margin:0 auto}
  .panel{background:rgba(3,10,25,.52);border:1px solid rgba(100,220,255,.18);box-shadow:0 0 14px rgba(0,210,255,.05) inset;border-radius:8px;padding:4px 5px;backdrop-filter:blur(4px);min-width:0;overflow:hidden}
  .label{font-size:10px;letter-spacing:.18em;opacity:.65}
  .value{font-weight:800;font-size:15px;letter-spacing:.04em}
  #bossBox{display:none;align-self:center;width:min(86vw,520px);margin-top:4px}
  #bossName{font-size:11px;letter-spacing:.22em;color:#ff8b9d}
  #bossGauge{height:6px;background:#1a0b15;border-radius:99px;overflow:hidden;margin-top:5px;border:1px solid rgba(255,80,120,.25)}
  #bossFill{height:100%;width:100%;background:linear-gradient(90deg,#ff335f,#ff8d3f);box-shadow:0 0 14px rgba(255,60,100,.65)}
  #hint{align-self:center;margin-bottom:3px;color:#bfeef7;font-size:10px;opacity:.48}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgba(6,25,58,.7),rgba(1,3,8,.94));z-index:10}
  #card{width:min(88vw,520px);padding:28px 24px;border:1px solid rgba(112,225,255,.3);border-radius:20px;background:rgba(5,11,24,.84);box-shadow:0 0 60px rgba(0,170,255,.16),inset 0 0 40px rgba(50,200,255,.035);text-align:center}
  h1{margin:0;font-size:clamp(28px,8vw,46px);letter-spacing:.18em;line-height:1.1}
  .subtitle{margin:10px 0 18px;color:#73d9ff;font-size:12px;letter-spacing:.2em}
  .desc{font-size:13px;line-height:1.7;color:#b6cbe0;margin-bottom:20px}
  button{border:1px solid rgba(120,230,255,.4);background:linear-gradient(180deg,#123252,#0b1a2e);color:#e8fbff;border-radius:14px;padding:13px 22px;font-weight:800;letter-spacing:.16em;font-size:13px;box-shadow:0 0 24px rgba(0,210,255,.15);touch-action:manipulation}
  button:active{transform:scale(.98);filter:brightness(1.15)}
  #toast{position:absolute;left:50%;top:29%;transform:translate(-50%,-50%) scale(.9);opacity:0;font-weight:900;letter-spacing:.18em;font-size:clamp(16px,5vw,28px);text-align:center;pointer-events:none;white-space:nowrap;text-shadow:0 0 18px currentColor;transition:opacity .12s,transform .12s;z-index:5}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
  #stats{position:absolute;right:10px;bottom:calc(12px + var(--safe-bottom));font-size:9px;opacity:.35;pointer-events:none}
  #modeSelect{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:0 0 16px}
  .modeBtn{padding:9px 12px;border-radius:10px;font-size:10px;letter-spacing:.08em}
  .modeBtn.selected{border-color:rgba(120,240,255,.9);box-shadow:0 0 22px rgba(70,220,255,.22);background:linear-gradient(180deg,#16476a,#0b2038)}
  #highScore{font-size:11px;color:#8feaff;opacity:.8;margin-top:10px}
  #skills{position:absolute;left:50%;bottom:calc(6px + var(--safe-bottom));transform:translateX(-50%);display:flex;gap:4px;width:min(94vw,260px);justify-content:center;pointer-events:auto}
  .skillBtn{touch-action:manipulation;min-width:0;width:72px;padding:7px 5px;border-radius:10px;background:rgba(5,14,30,.82);border:1px solid rgba(130,220,255,.25);box-shadow:0 0 18px rgba(0,200,255,.12);font-size:10px;letter-spacing:.08em;line-height:1.1}
  .skillBtn .cool{display:block;font-size:9px;opacity:.65;margin-top:3px}
  .skillBtn.ready{border-color:rgba(110,240,255,.75);box-shadow:0 0 24px rgba(90,230,255,.2)}
  .skillBtn:disabled{opacity:.42;filter:saturate(.5)}
  .shieldPanel .value{font-variant-numeric:tabular-nums}
  @media(max-width:430px){
    #hint{display:none}
    #boss{width:min(68vw,330px)}
    .topbar{grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;width:calc(100vw - 12px)}
    .panel{padding:4px 4px;border-radius:7px}
    .panel .label{font-size:7px}
    .panel .value{font-size:11px}
    .topbar{gap:5px}
    .panel{padding:6px 7px}
    .panel .label{font-size:8px}
    .panel .value{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  }

  #pauseBtn{position:absolute;right:8px;top:calc(8px + var(--safe-top));z-index:6;pointer-events:auto;padding:8px 10px;border-radius:10px;font-size:10px;letter-spacing:.08em;background:rgba(5,14,30,.78)}
  #waveBox{position:absolute;left:50%;top:calc(82px + var(--safe-top));transform:translateX(-50%);z-index:2;pointer-events:none;text-align:center;padding:4px 10px;border-radius:999px;background:rgba(3,10,25,.48);border:1px solid rgba(100,220,255,.14);box-shadow:0 0 18px rgba(0,210,255,.06) inset;font-weight:900;font-size:11px;letter-spacing:.18em;white-space:nowrap}
  #pauseOverlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(1,3,8,.72);backdrop-filter:blur(6px);z-index:20}
  #pauseCard{width:min(88vw,460px);padding:24px 20px;border:1px solid rgba(112,225,255,.28);border-radius:18px;background:rgba(5,11,24,.92);box-shadow:0 0 50px rgba(0,170,255,.14);text-align:center}
  #pauseCard h2{margin:0 0 8px;font-size:24px;letter-spacing:.14em}
  .setting{margin:16px 0;text-align:left}.setting label{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.08em;opacity:.9;margin-bottom:8px}.setting input[type=range]{width:100%}
  .pauseActions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}.pauseActions button{min-width:118px}
  @media(max-width:430px){#waveBox{top:calc(92px + var(--safe-top));font-size:10px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div>
    <div class="topbar">
      <div class="panel"><div class="label">SCORE</div><div id="score" class="value">0</div></div>
      <div class="panel"><div class="label">POWER</div><div id="power" class="value">LV 1</div></div>
      <div class="panel"><div class="label">HP</div><div id="hp" class="value">3</div></div><div class="panel shieldPanel"><div class="label">SHIELD</div><div id="shieldPct" class="value">100%</div></div><div class="panel"><div class="label">PHASER</div><div id="phaserStatus" class="value">READY</div></div><div class="panel"><div class="label">TORPEDO</div><div id="torpedoStatus" class="value">READY</div></div>
    </div>
    <div id="bossBox" class="panel">
      <div id="bossName">BOSS // AURORA WARDEN</div>
      <div id="bossGauge"><div id="bossFill"></div></div>
    </div>
  </div>
  <div id="hint">ドラッグ：移動　/　攻撃：自動　/　PHASE・NOVA・OVERDRIVE：タップで発動　/　PHASER・TORPEDO：WAVE 4解禁</div>
</div>
<div id="waveBox">WAVE <span id="waveValue">1</span></div>
<button id="pauseBtn">PAUSE</button>
<div id="toast"></div>
<div id="flash"></div>
<div id="skills">
  <button id="skillPhase" class="skillBtn ready">PHASE<span class="cool">READY</span></button>
  <button id="skillNova" class="skillBtn ready">NOVA<span class="cool">READY</span></button>
  <button id="skillOver" class="skillBtn ready">OVERDRIVE<span class="cool">READY</span></button>
</div>

<div id="overlay">
  <div id="card">
    <h1 id="title">STARFALL</h1>
    <div class="subtitle">COSMIC RAID // MOBILE SHOOTER</div>
    <div id="desc" class="desc">自機を指でドラッグして操縦。<br>モードを選択してミッションを開始してください。</div>
    <div id="modeSelect">
      <button class="modeBtn selected" data-mode="normal">NORMAL<br><span>8 BOSS</span></button>
      <button class="modeBtn" data-mode="quick">QUICK<br><span>3 BOSS</span></button>
      <button class="modeBtn" data-mode="endless">ENDLESS<br><span>∞ BOSS</span></button>
    </div>
    <div id="highScore">ENDLESS HIGH SCORE: 0</div>
    <button id="start">MISSION START</button>
  </div>
</div>
<div id="pauseOverlay">
  <div id="pauseCard">
    <h2>PAUSED</h2>
    <div class="desc" style="margin-bottom:8px">操縦・自動攻撃は一時停止しています。</div>
    <div class="setting">
      <label><span>TAP / DRAG SENSITIVITY</span><b id="sensitivityValue">100%</b></label>
      <input id="sensitivityRange" type="range" min="30" max="250" value="100" step="5">
    </div>
    <div class="setting">
      <label><span>VIBRATION</span><b id="vibrationValue">ON</b></label>
      <button id="vibrationBtn" style="width:100%;padding:9px">ON / OFF</button>
    </div>
    <div class="setting">
      <label><span>LIGHTWEIGHT FX</span><b id="liteValue">AUTO</b></label>
      <button id="liteBtn" style="width:100%;padding:9px">AUTO / LIGHT</button>
    </div>
    <div class="pauseActions">
      <button id="resumeBtn">RESUME</button>
      <button id="restartBtn">RESTART</button>
    </div>
  </div>
</div>
<div id="stats"></div>

<script>
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', {alpha:false});
const scoreEl = document.getElementById('score');
const powerEl = document.getElementById('power');
const hpEl = document.getElementById('hp');
const bossBox = document.getElementById('bossBox');
const bossFill = document.getElementById('bossFill');
const bossNameEl = document.getElementById('bossName');
const overlay = document.getElementById('overlay');
const title = document.getElementById('title');
const desc = document.getElementById('desc');
const startBtn = document.getElementById('start');
const toast = document.getElementById('toast');
const flash = document.getElementById('flash');
const statsEl = document.getElementById('stats');
const skillPhaseBtn = document.getElementById('skillPhase');
const skillNovaBtn = document.getElementById('skillNova');
const skillOverBtn = document.getElementById('skillOver');
const shieldPctEl = document.getElementById('shieldPct');
const phaserStatusEl = document.getElementById('phaserStatus');
const torpedoStatusEl = document.getElementById('torpedoStatus');
const modeButtons = [...document.querySelectorAll('.modeBtn')];
const highScoreEl = document.getElementById('highScore');
const waveValueEl = document.getElementById('waveValue');
const pauseBtn = document.getElementById('pauseBtn');
const pauseOverlay = document.getElementById('pauseOverlay');
const resumeBtn = document.getElementById('resumeBtn');
const restartBtn = document.getElementById('restartBtn');
const sensitivityRange = document.getElementById('sensitivityRange');
const sensitivityValue = document.getElementById('sensitivityValue');
const vibrationBtn = document.getElementById('vibrationBtn');
const vibrationValue = document.getElementById('vibrationValue');
const liteBtn = document.getElementById('liteBtn');
const liteValue = document.getElementById('liteValue');

const DPR_CAP = innerWidth <= 700 ? 1.5 : 2;
let W=360,H=640,DPR=1, last=0;
let running=false, gameOver=false, paused=false, audioCtx=null;
let gameMode='normal', quickBossIndex=0, newHighScore=false;
const ENDLESS_HS_KEY='starfall_cosmic_raid_endless_highscore_v1';
const QUICK_BOSSES=[2,5,8];
let time=0, score=0, wave=1, combo=0, comboTimer=0;
let spawnTimer=0, shootTimer=0, bossTimer=0, bossActive=false, bossPhase=0, bossAtkTimer=0;
let shake=0, flashPower=0, slow=0;
let bossStage=0, bossKills=0, bossName='';
let waveGate=0,waveTime=0,novaScoreDamp=0,novaWaveGrace=0;
let phaserTimer=0, phaserFlash=0, phaserTarget=null, phaserActive=0, phaserTick=0, phaserJustFired=false;
let phaserTwin=false, phaserTarget2=null, phaserAim1=0, phaserAim2=0;
let torpedoTimer=0, torpedoFlash=0;
let autoCannonTimer=0, autoAim1=-Math.PI/2, autoAim2=-Math.PI/2;
let skillPhaseCd=0, skillNovaCd=0, skillOverCd=0, overdrive=0;
let bossLaser=0, bossLaserAngle=0, bossLaserMode=0;
let touchId=null, targetX=0,targetY=0;
let touchSensitivity=1.0, vibrationEnabled=true, lightweightOverride=false;
let fps=60,fpsAcc=0,fpsFrames=0, hudAcc=0;
let bgGradient=null, nebulaGradient=null, mobileLite=false;

const GAME_SCALE=.72;
const PLAYER_SCALE=.60;
const FIELD_SCALE=.84;
const player={x:180,y:560,r:9.5*PLAYER_SCALE,hp:3,maxHp:3,power:1,speedBoost:0,shield:0,shieldPct:100,shieldDelay:0,inv:0,bomb:1};
const stars=[];
const bullets=Array.from({length:140},()=>({active:false,x:0,y:0,vx:0,vy:0,r:3,damage:1,kind:0}));
const enemyBullets=Array.from({length:220},()=>({active:false,x:0,y:0,vx:0,vy:0,r:4,life:0,kind:0,turn:0,homing:0}));
const enemies=Array.from({length:130},()=>({active:false,x:0,y:0,vx:0,vy:0,r:15,hp:1,maxHp:1,type:0,t:0,phase:0,cool:0,aux:0}));
const particles=Array.from({length:360},()=>({active:false,x:0,y:0,vx:0,vy:0,life:0,max:0,size:2,h:190,drag:.98,alpha:1}));
const powerups=Array.from({length:18},()=>({active:false,x:0,y:0,vy:0,r:11,type:0,t:0}));
const rings=Array.from({length:60},()=>({active:false,x:0,y:0,r:0,max:30,life:0,h:190}));
const torpedoes=Array.from({length:10},()=>({active:false,x:0,y:0,vx:0,vy:0,r:5*GAME_SCALE*FIELD_SCALE,speed:205,turn:3.4,life:7,target:null,armed:false,lane:0,launchDelay:0}));
const bossTorpedoes=Array.from({length:18},()=>({active:false,x:0,y:0,vx:0,vy:0,r:6,spd:150,turn:2.0,life:8}));
let bossTorpedoTimer=1.8;
let bossPhaseIndex=0,bossPhasePulse=0,bossShield=0,bossShieldMax=0;
let activeEnemyBulletCount=0;
let activeEnemyCount=0;
let boss={x:180,y:-100,r:54,hp:0,maxHp:1,t:0,visible:false};

for(let i=0;i<95;i++) stars.push({x:Math.random(),y:Math.random(),z:Math.random(),s:.3+Math.random()*1.7});

function resize(){
  W=innerWidth; H=innerHeight; mobileLite=W<=700; const cap=(mobileLite?1.5:2); DPR=Math.min(devicePixelRatio||1,cap);
  canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.imageSmoothingEnabled=true;
  bgGradient=ctx.createLinearGradient(0,0,0,H);bgGradient.addColorStop(0,'#02040c');bgGradient.addColorStop(.55,'#03081a');bgGradient.addColorStop(1,'#050310');
  nebulaGradient=ctx.createRadialGradient(W*.5,H*.45,0,W*.5,H*.45,W*.72);nebulaGradient.addColorStop(0,'rgba(0,105,160,.12)');nebulaGradient.addColorStop(.45,'rgba(60,20,130,.045)');nebulaGradient.addColorStop(1,'rgba(0,0,0,0)');
  if(!running){ player.x=W*.5; player.y=H*.82; targetX=player.x;targetY=player.y; }
}
addEventListener('resize',resize,{passive:true});
resize();

function clamp(v,a,b){return v<a?a:v>b?b:v}
function rand(a,b){return a+Math.random()*(b-a)}
function pick(arr){return arr[(Math.random()*arr.length)|0]}

function activateAudio(){
  if(!audioCtx){
    try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  }
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
}
function tone(f, dur=.05, type='sine', vol=.045){
  if(!audioCtx) return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type; o.frequency.setValueAtTime(f,audioCtx.currentTime);
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
}
function noise(dur=.12,vol=.05){
  if(!audioCtx) return;
  const len=Math.floor(audioCtx.sampleRate*dur), buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
  const data=buf.getChannelData(0); for(let i=0;i<len;i++) data[i]=(Math.random()*2-1)*(1-i/len);
  const s=audioCtx.createBufferSource(),g=audioCtx.createGain(); g.gain.value=vol;s.buffer=buf;s.connect(g);g.connect(audioCtx.destination);s.start();
}

function getEndlessHighScore(){
  try{return Number(localStorage.getItem(ENDLESS_HS_KEY)||0)||0}catch(e){return 0}
}
function setMode(mode){
  if(!['normal','quick','endless'].includes(mode))mode='normal';
  gameMode=mode;
  modeButtons.forEach(b=>b.classList.toggle('selected',b.dataset.mode===gameMode));
  const labels={normal:'8体のボスを順番に撃破してクリア。',quick:'3体のボスだけを短時間で攻略。',endless:'8体目以降もボスが無限に強化される。ハイスコア更新対象。'};
  highScoreEl.textContent=`ENDLESS HIGH SCORE: ${getEndlessHighScore().toLocaleString('ja-JP')}`;
  desc.innerHTML=labels[gameMode];
}
function applyQuickLoadout(){
  if(gameMode!=='quick')return;
  if(quickBossIndex===0){
    // Quick boss 1: torpedo only.
    torpedoTimer=0; phaserTimer=999; autoCannonTimer=999;
  }else if(quickBossIndex===1){
    // Quick boss 2: equivalent to Normal Wave 10 loadout.
    torpedoTimer=0; phaserTimer=0; autoCannonTimer=999;
  }else{
    // Quick boss 3: final loadout.
    torpedoTimer=0; phaserTimer=0; autoCannonTimer=0;
  }
}
function quickWeaponUnlocked(kind){
  if(gameMode!=='quick')return false;
  if(kind==='torpedo')return true;
  if(kind==='phaser')return quickBossIndex>=1;
  if(kind==='auto')return quickBossIndex>=2;
  return false;
}
function reset(){
  paused=false;pauseOverlay.style.display='none';
  score=0;wave=1;combo=0;comboTimer=0;spawnTimer=.3;shootTimer=0;bossTimer=0;
  bossActive=false;bossPhase=0;bossAtkTimer=1.7;bossLaser=0;bossLaserAngle=0;bossLaserMode=0;
  bossStage=0;bossKills=0;bossName='';quickBossIndex=0;newHighScore=false;bossTorpedoTimer=1.8;bossPhaseIndex=0;bossPhasePulse=0;bossShield=0;bossShieldMax=0;
  autoCannonTimer=1.0;autoAim1=-Math.PI/2;autoAim2=-Math.PI/2;
  skillPhaseCd=0;skillNovaCd=0;skillOverCd=0;overdrive=0;
  player.x=W*.5;player.y=H*.82;targetX=player.x;targetY=player.y; phaserTimer=.75;phaserFlash=0;phaserTarget=null;phaserActive=0;phaserTick=0;phaserJustFired=false;
  phaserTwin=false;phaserTarget2=null;phaserAim1=-Math.PI/2;phaserAim2=-Math.PI/2;
  torpedoTimer=(gameMode==='quick'?0:4.2);torpedoFlash=0;player.hp=3;player.power=1;player.speedBoost=0;player.shield=0;player.shieldPct=100;player.shieldDelay=0;player.bomb=1;player.inv=0;
  for(const a of [bullets,enemyBullets,enemies,particles,powerups,rings,bossTorpedoes]) for(const o of a)o.active=false; for(const o of torpedoes){o.active=false;o.launchDelay=0;o.target=null;} activeEnemyBulletCount=0; activeEnemyCount=0;
  boss.visible=false;boss.y=-100;boss.hp=0;
  updateHud();
}

function updateHud(force=false){
   if(!force && running && hudAcc<0.06) return;
   hudAcc=0;
  scoreEl.textContent=Math.floor(score).toLocaleString('ja-JP');
  if(waveValueEl) waveValueEl.textContent=wave;
  let status=`LV ${player.power}`;
  if(player.shield>0) status+='  SHIELD';
  if(player.bomb) status+=`  BOMB×${player.bomb}`;
  if(overdrive>0) status+='  OVERDRIVE';
  powerEl.textContent=status;
  if(shieldPctEl) shieldPctEl.textContent=Math.ceil(player.shieldPct)+'%';
  const weaponLocked=gameMode==='quick' ? false : wave<=3;
  if(phaserStatusEl) phaserStatusEl.textContent=((gameMode==='quick' && !quickWeaponUnlocked('phaser')) || weaponLocked)?'LOCKED':(phaserActive>0?'FIRING':(phaserTimer<=0?'FIRE':phaserTimer.toFixed(1)+'s')); 
  if(torpedoStatusEl) torpedoStatusEl.textContent=((gameMode==='quick' && !quickWeaponUnlocked('torpedo')) || weaponLocked)?'LOCKED':(torpedoTimer<=0?'FIRE':torpedoTimer.toFixed(1)+'s');
  hpEl.textContent='●'.repeat(Math.max(0,player.hp))+'○'.repeat(Math.max(0,player.maxHp-player.hp));
  bossBox.style.display=bossActive?'block':'none';
  if(bossActive) bossFill.style.width=`${clamp(boss.hp/boss.maxHp,0,1)*100}%`;
  const skillData=[
    [skillPhaseBtn,skillPhaseCd,'PHASE'],
    [skillNovaBtn,skillNovaCd,'NOVA'],
    [skillOverBtn,skillOverCd,'OVERDRIVE']
  ];
  for(const [btn,cd,label] of skillData){
    const ready=cd<=0 && running;
    btn.disabled=!ready;
    btn.classList.toggle('ready',ready);
    const span=btn.querySelector('.cool');
    span.textContent=ready?'READY':`${cd.toFixed(1)}s`;
  }
  if(bossActive){ bossNameEl.textContent=`BOSS // ${bossName}${bossPhaseIndex>0?' // PHASE '+(bossPhaseIndex+1):''}`; }
}

function toastMsg(text, color='#7de8ff', ms=900){

function spawnParticle(x,y,n=16,h=190,power=1){
  const particleBudget=innerWidth<=700?260:360;
  let activeParticles=0;
  if(innerWidth<=700){ for(const v of particles) if(v.active){activeParticles++; if(activeParticles>=particleBudget) break;} n=Math.min(n,Math.max(0,particleBudget-activeParticles)); }
  for(let i=0;i<n;i++){
    const p=particles.find(v=>!v.active); if(!p)break;
    const a=Math.random()*Math.PI*2, s=rand(45,220)*power;
    p.active=true;p.x=x;p.y=y;p.vx=Math.cos(a)*s;p.vy=Math.sin(a)*s;p.life=p.max=rand(.25,.75);p.size=rand(1,4)*power*GAME_SCALE*FIELD_SCALE;p.h=h+rand(-18,18);p.drag=.95+Math.random()*.04;p.alpha=1;
  }

function acquireBullet(pool){
  return pool.find(v=>!v.active)||null;
}

// Difficulty is kept in a comfortable band instead of ramping endlessly.
// It reacts gently to shield state: struggling players get more reaction time,
// while strong runs still retain the intended progression.
function difficultyAssist(){
  const lowShield = clamp((42-player.shieldPct)/42,0,1);
  const recovery = clamp((player.shieldPct-82)/18,0,1);
  return clamp(lowShield*.72 - recovery*.18,0,.72);
}
function enemyBulletSpeedMultiplier(){
  const waveRamp = Math.min(.12, Math.max(0,wave-1)*.012);
  return Math.max(.76, .88 + waveRamp - difficultyAssist()*.10);
}
function enemyBulletBudget(){
  return Math.max(30, Math.min(46, 42 + Math.floor(difficultyAssist()*4)));
}

function firePlayer(){
  const spread=player.power>=3?[-.24,0,.24]:player.power===2?[-.13,.13]:[0];
  for(const off of spread){
    const b=acquireBullet(bullets);if(!b)continue;
    b.active=true;b.x=player.x;b.y=player.y-16;b.vx=Math.sin(off)*120;b.vy=-670;b.r=3.5*GAME_SCALE*FIELD_SCALE;b.damage=player.power>=4?2:1;b.kind=0;
  }
  tone(680+player.power*70,.035,'triangle',.018);
}
function enemyShot(x,y,angle,speed=180,r=4,kind=0,turn=0){
  if(activeEnemyBulletCount>=enemyBulletBudget()) return;

  const b=acquireBullet(enemyBullets);if(!b)return;
  const slow=enemBulletSafeSpeed(speed);
  b.active=true;b.x=x;b.y=y;
  b.vx=Math.cos(angle)*slow;b.vy=Math.sin(angle)*slow;
  b.r=r*GAME_SCALE*FIELD_SCALE;b.life=5;b.kind=kind;b.turn=turn;b.homing=kind===2?1:0; activeEnemyBulletCount++;
}
function enemBulletSafeSpeed(speed){
  return speed*enemyBulletSpeedMultiplier();
}
function radial(x,y,count,speed,offset=0,r=4){
  for(let i=0;i<count;i++) enemyShot(x,y,offset+i*Math.PI*2/count,speed,r);
}
function directed(x,y,tx,ty,speed=220,r=4){
  const a=Math.atan2(ty-y,tx-x);enemyShot(x,y,a,speed,r);
}


function spawnEnemy(type=0,x=rand(25,W-25),y=-25){

  e.active=true;activeEnemyCount++;e.x=x;e.y=y;e.type=type;e.t=0;e.phase=rand(0,Math.PI*2);e.cool=rand(.6,1.7);

  else if(type===1){e.r=18*GAME_SCALE*FIELD_SCALE;e.hp=e.maxHp=6+wave;e.vx=0;e.vy=(66+wave)*d;e.cool=.9}

  else if(type===4){e.r=16*GAME_SCALE*FIELD_SCALE;e.hp=e.maxHp=4+Math.floor(wave/2);e.vx=rand(-55,55);e.vy=92*d;e.cool=1.25;e.aux=0;} // splitter
  else if(type===5){e.r=13*GAME_SCALE*FIELD_SCALE;e.hp=e.maxHp=2+Math.floor(wave/4);e.vx=0;e.vy=82*d;e.cool=.85;e.aux=rand(0,6.28);} // orbital
  else if(type===6){e.r=12*GAME_SCALE*FIELD_SCALE;e.hp=e.maxHp=3+Math.floor(wave/2);e.vx=rand(-20,20);e.vy=48*d;e.cool=1.5;e.aux=0;} // sniper
  else if(type===7){e.r=14*GAME_SCALE*FIELD_SCALE;e.hp=e.maxHp=4+Math.floor(wave/2);e.vx=rand(-35,35);e.vy=62*d;e.cool=1.8;e.aux=0;} // missile boat
  else {e.r=17*GAME_SCALE*FIELD_SCALE;e.hp=e.maxHp=6+Math.floor(wave*.65);e.vx=rand(-15,15);e.vy=46*d;e.cool=1.0;e.aux=rand(0,6.28);} // support

function formation(){
  const n=Math.min(10,4+Math.floor(wave*.72));
  for(let i=0;i<n;i++){
    let t;
    if(wave<3) t=(i%3===1?1:0);
    else if(wave<5) t=(i%5===0?3:i%4===0?4:i%3===1?1:0);
    else t=(i%7===0?8:i%6===0?7:i%5===0?6:i%5===1?3:i%4===0?4:i%3===1?1:0);
    spawnEnemy(t, W*(.08+i*(.84/Math.max(1,n-1))), -30-i*7);
  }
}
function bossConfig(stage){
  const list=[
    {name:'AURORA WARDEN',kind:1,hp:620,r:.16,spd:48,color:'#58d8ff',style:'warden'},
    {name:'SOLAR BEHEMOTH',kind:2,hp:885,r:.18,spd:47,color:'#ff9c4a',style:'behemoth'},
    {name:'VOID HYDRA',kind:3,hp:1460,r:.20,spd:52,color:'#c96cff',style:'hydra'},
    {name:'SINGULARITY CORE',kind:4,hp:2360,r:.215,spd:35,color:'#65ffcf',style:'core'},
    {name:'DREAD COLOSSUS',kind:5,hp:3600,r:.235,spd:31,color:'#ff527a',style:'colossus'},
    {name:'STAR DEVOURER',kind:6,hp:5175,r:.245,spd:29,color:'#ff6bf2',style:'devourer'},
    {name:'NULL CITADEL',kind:7,hp:7200,r:.255,spd:27,color:'#8a9cff',style:'citadel'},
    {name:'COSMIC JUGGERNAUT',kind:8,hp:9900,r:.27,spd:25,color:'#ff4f8b',style:'juggernaut'}
  ];
  const base=list[Math.min(stage-1,list.length-1)];
  const loop=Math.max(0,stage-list.length);
  const scale=1+loop*.30;
  const progression=1+Math.max(0,stage-1)*.04+Math.max(0,wave-stage)*.010;
  return {...base,hp:Math.round(base.hp*scale*progression),r:Math.min(90,W*base.r)*GAME_SCALE};
}

function bossPhaseInfo(){
  const ratio=clamp(boss.hp/Math.max(1,boss.maxHp),0,1);
  if(ratio>.75)return 0;
  if(ratio>.50)return 1;
  if(ratio>.25)return 2;
  return 3;
}

function updateBossPhase(){
  const next=bossPhaseInfo();
  if(next!==bossPhaseIndex){
    bossPhaseIndex=next;
    bossPhasePulse=.65;
    bossAtkTimer=Math.min(bossAtkTimer,.7);
    if(next>=1)toastMsg(`BOSS PHASE ${next+1}`,'#ffb3c0',650);
    if(bossShieldMax>0){
      bossShield=Math.min(bossShieldMax, bossShieldMax*(next>=2?.55:.35));
    }
    tone(150+next*30,.12,'square',.028);
  }
}

function startBoss(){
  // Bosses must progress sequentially. Score jumps sharply after a boss kill, so score-based stage selection would skip directly to late bosses.
  bossStage=gameMode==='quick' ? QUICK_BOSSES[quickBossIndex] : (bossKills+1);
  const cfg=bossConfig(bossStage);
  bossActive=true;boss.visible=true;boss.x=W/2;boss.y=-90;boss.r=cfg.r;boss.maxHp=cfg.hp;boss.hp=boss.maxHp;
  boss.t=0;bossAtkTimer=2.0;bossPhase=0;bossPhaseIndex=0;bossPhasePulse=.25;bossLaser=0;bossLaserAngle=0;bossLaserMode=0;bossName=cfg.name;
  bossShieldMax=bossStage>=3?Math.round(cfg.hp*.14):0; bossShield=bossShieldMax;
  for(const e of enemies)e.active=false;
  activeEnemyCount=0;
  for(const b of enemyBullets) b.active=false; activeEnemyBulletCount=0;
  const stageLabel=bossStage;
  toastMsg(`WARNING // BOSS-${stageLabel} ${cfg.name}` ,cfg.color,1800);
  shake=10;flashPower=.24;tone(70+bossStage*14,.7,'sawtooth',.05);
  updateHud();
}

function dropPower(x,y,forceType=null){
  if(forceType===null && Math.random()>.26)return;
  const p=powerups.find(v=>!v.active);if(!p)return;
  p.active=true;p.x=x;p.y=y;p.vy=70;p.t=rand(0,6);p.r=11*GAME_SCALE*FIELD_SCALE;
  p.type=forceType===null?(Math.random()<.34?0:Math.random()<.5?1:2):forceType;
}
function collectPower(p){
  p.active=false;
  if(p.type===0){player.power=Math.min(7,player.power+1);toastMsg('POWER +1','#7eeaff');tone(1080,.12,'square',.045)}
  else if(p.type===1){player.shield=7;player.shieldPct=Math.min(100,player.shieldPct+45);player.shieldDelay=0;toastMsg('SHIELD RECHARGED','#63ddff');tone(460,.18,'sine',.05)}
  else {player.bomb=Math.min(3,player.bomb+1);toastMsg('BOMB +1','#ffd56b');tone(170,.2,'sawtooth',.05)}
  spawnParticle(player.x,player.y,24,p.type===0?190:p.type===1?260:45,1.1);

}

function hitPlayer(){
  if(player.inv>0||gameOver)return;

  // Main defensive system: a 100% regenerating shield absorbs incoming hits.
  // HP remains at 3 and is only lost after the shield has been depleted.
  const damage = 7 + Math.min(5,Math.floor(wave/6));
  if(player.shieldPct>0){
    player.shieldPct=Math.max(0,player.shieldPct-damage);
    player.shieldDelay=1.8;
    player.inv=.38;
    shake=5;
    flashPower=.10;
    spawnParticle(player.x,player.y,18,190,1);
    tone(180,.08,'triangle',.045);

    if(player.shieldPct<=0){
      toastMsg('SHIELD OFFLINE // HP EXPOSED','#ffad72',800);
      tone(85,.18,'sawtooth',.06);
    }else{
      toastMsg(`SHIELD ${Math.ceil(player.shieldPct)}%`,'#63ddff',450);
    }
    updateHud();
    return;
  }

  // Emergency damage only when the shield is at 0%.
  player.hp--;
  player.inv=1.15;
  shake=9;
  flashPower=.24;
  combo=0;
  spawnParticle(player.x,player.y,38,350,1.2);
  noise(.13,.05);
  tone(110,.18,'sawtooth',.05);

  // A depleted shield begins a fast emergency recharge rather than leaving
  // the player permanently exposed.
  player.shieldDelay=2.5;
  if(player.hp<=0) endGame();
  updateHud();
}

function explodeEnemy(e){
  const gain=e.type===1?350:e.type===4?420:e.type===3?240:e.type===5?200:e.type===2?140:100;
  e.active=false;activeEnemyCount=Math.max(0,activeEnemyCount-1);
  score += gain * (1+Math.min(combo,20)*.04);
  combo++;comboTimer=1.8;
  spawnParticle(e.x,e.y,e.type===1?34:24,e.type===4?300:e.type===1?25:145,e.type===4?1.6:e.type===1?1.5:1);
  shake=Math.max(shake,e.type===1||e.type===4?6:2.5);
  if(e.type===1) dropPower(e.x,e.y);
  if(e.type===3) radial(e.x,e.y,5,120,e.phase,3);
  if(e.type===4 && wave>=3){
    for(let i=0;i<2;i++) spawnEnemy(2,clamp(e.x+rand(-22,22),18,W-18),e.y+rand(-8,8));
  }
  tone(e.type===1||e.type===4?120:220+Math.random()*180,.07,e.type===1||e.type===4?'sawtooth':'triangle',.045);
}

function useBomb(){
  if(player.bomb<=0||gameOver)return;
  player.bomb--;shake=14;flashPower=.75;slow=.22;
  toastMsg('NOVA BOMB','#fff4a8',800);tone(50,.5,'sawtooth',.08);
  for(const e of enemies) if(e.active){e.hp-=18;spawnParticle(e.x,e.y,12,45,.8);if(e.hp<=0)explodeEnemy(e)}
  for(const b of enemyBullets) b.active=false; activeEnemyBulletCount=0;
  if(bossActive){const dmg=220+player.power*30;if(bossShield>0)bossShield=Math.max(0,bossShield-dmg);else boss.hp=Math.max(0,boss.hp-dmg);spawnParticle(boss.x,boss.y,80,15,1.8)}
  updateHud();
}
function skillPhase(){

function spawnWave(dt){
  // Quick mode uses three condensed combat segments tied to its selected bosses.
  if(gameMode==='quick'){
    spawnTimer-=dt;
    if(spawnTimer<=0){
      const r=Math.random();
      const type=quickBossIndex===0 ? (r<.58?0:r<.82?2:1) : quickBossIndex===1 ? (r<.30?0:r<.48?2:r<.66?1:r<.82?3:r<.94?4:5) : (r<.18?0:r<.30?2:r<.43?1:r<.56?3:r<.69?4:r<.80?5:r<.90?6:r<.97?7:8);
      spawnEnemy(type);
      if(quickBossIndex>=1 && Math.random()<.14)spawnEnemy(quickBossIndex===2?7:4);
      if(Math.random()<.08)spawnEnemy(0);
      spawnTimer=Math.max(.34,1.10-wave*.012);
    }
    if(!bossActive && bossKills<3 && score>=900+quickBossIndex*1500 && waveTime>=10){
      startBoss();
    }
    return;
  }
  spawnTimer-=dt;
  if(spawnTimer<=0){
    const r=Math.random();
    let type=0;
    if(wave<2) type=r<.62?0:r<.87?2:1;
    else if(wave<4) type=r<.40?0:r<.62?2:r<.82?1:r<.93?3:4;
    else if(wave<7) type=r<.24?0:r<.39?2:r<.54?1:r<.68?3:r<.80?4:r<.90?5:r<.95?6:7;
    else type=r<.18?0:r<.31?2:r<.45?1:r<.58?3:r<.70?4:r<.80?5:r<.88?6:r<.95?7:8;
    spawnEnemy(type);
    if(wave>=4&&Math.random()<.11)spawnEnemy(type===5?2:(type>=6?rand(0,1)|0:4));
    if(Math.random()<.065+Math.min(.11,wave*.004))spawnEnemy(0);
    spawnTimer=Math.max(.30,1.18-wave*.015);
  }
  if(score>=waveGate && waveTime>=18 && novaWaveGrace<=0 && score>0){
    wave++;
    if(wave===15) toastMsg('TORPEDO MK-II ONLINE // SPEED + TRACKING + WARHEAD','#8de8ff',1200);
    if(wave===20) toastMsg('DUAL PHASER ONLINE // TWIN BEAMS STANDARD','#c7b5ff',1200);
    if(wave===25) toastMsg('TORPEDO BURST-II ONLINE // 2-SHOT BURST','#8de8ff',1200);
    if(wave===25) toastMsg('PHASER CAPACITOR UPGRADE // DAMAGE +18%','#ffe29a',1200);
    waveGate=score+4200+wave*350; waveTime=0;
    formation();
    toastMsg(`WAVE ${wave}`,'#7de8ff',700);
  }
  if(!bossActive && score>=3000 && score>=bossTimer+3000){bossTimer=Math.floor(score/3000)*3000;startBoss()}
}

function updateStars(dt){
  for(const s of stars){s.y += dt*(.025+s.z*.13);if(s.y>1.05){s.y=-.03;s.x=Math.random()}}
}

function update(dt){
  hudAcc+=dt;
  waveTime+=dt;
  novaWaveGrace=Math.max(0,novaWaveGrace-dt);
  updatePhaser(dt);
  updateTorpedoes(dt);
  updateBossTorpedoes(dt);
  // Regeneration starts after a short delay following a hit.
  if(player.shieldDelay>0){
    player.shieldDelay=Math.max(0,player.shieldDelay-dt);
  }else if(player.shieldPct<100){
    player.shieldPct=Math.min(100,player.shieldPct+7*dt);
  }

  time+=dt;
  updateStars(dt);

  if(slow>0){slow-=dt;dt*=.18}
  if(shake>0)shake=Math.max(0,shake-dt*18);
  if(flashPower>0)flashPower=Math.max(0,flashPower-dt*3.2);
  if(player.inv>0)player.inv=Math.max(0,player.inv-dt);
  if(player.speedBoost>0)player.speedBoost=Math.max(0,player.speedBoost-dt);
  if(overdrive>0)overdrive=Math.max(0,overdrive-dt);
  skillPhaseCd=Math.max(0,skillPhaseCd-dt);skillNovaCd=Math.max(0,skillNovaCd-dt);skillOverCd=Math.max(0,skillOverCd-dt);
  if(comboTimer>0)comboTimer-=dt;else combo=0;

  const follow=1-Math.pow(.0008,dt);
  player.x += (targetX-player.x)*follow;
  player.y += (targetY-player.y)*follow;
  player.x=clamp(player.x,18,W-18);player.y=clamp(player.y,H*.25,H-18);

  const fireRate=overdrive>0?.075:Math.max(.075,.19-player.power*.015);
  shootTimer-=dt;
  if(shootTimer<=0){firePlayer();shootTimer=fireRate}
  updateAutoCannon(dt);

  spawnWave(dt);

  for(const b of bullets){
    if(!b.active)continue;
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<-30||b.x<-30||b.x>W+30)b.active=false;
  }

  for(const e of enemies){
    if(!e.active)continue;
    e.t+=dt;e.cool-=dt;
    if(e.type===0){e.x+=e.vx*dt+Math.sin(e.t*2.1+e.phase)*24*dt;e.y+=e.vy*dt}
    else if(e.type===1){e.y+=e.vy*dt;e.x+=Math.sin(e.t*1.1+e.phase)*24*dt;if(e.cool<=0){directed(e.x,e.y,player.x,player.y,165,5);e.cool=Math.max(.7,1.45-wave*.012)}}
    else if(e.type===2){e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.x<14||e.x>W-14)e.vx*=-1}
    else if(e.type===3){e.y+=e.vy*dt;e.x=W*.5+(e.phase%2?1:-1)*Math.sin(e.t*.95+e.phase)*W*.28;if(e.cool<=0){radial(e.x,e.y,3,140,e.phase,4);e.cool=Math.max(.8,1.45-wave*.01)}}
    else if(e.type===4){e.y+=e.vy*dt;e.x+=Math.sin(e.t*2.6+e.phase)*38*dt;if(e.cool<=0&&e.y>70&&e.y<240){for(let a=-.22;a<=.22;a+=.22)enemyShot(e.x,e.y,Math.PI/2+a,145,4);e.cool=1.35}}
    else if(e.type===5){e.y+=e.vy*dt;e.x+=Math.sin(e.t*1.7+e.phase)*55*dt;if(e.cool<=0){e.aux+=.7;directed(e.x,e.y,player.x,player.y,175,4);e.cool=.95}}
    else if(e.type===6){e.y+=e.vy*dt;e.x+=Math.sin(e.t*.9+e.phase)*24*dt;if(e.cool<=0&&e.y>80&&e.y<H*.55){
      const leadX=player.x+(targetX-player.x)*.18; directed(e.x,e.y,leadX,player.y,240+wave*2,4); e.cool=Math.max(.95,1.8-wave*.018);
      }
    }
    else if(e.type===7){e.y+=e.vy*dt;e.x+=Math.sin(e.t*1.4+e.phase)*34*dt;if(e.cool<=0&&e.y>70){
      const a=Math.atan2(player.y-e.y,player.x-e.x); enemyShot(e.x,e.y,a,145+wave*2,4,2,2.8); e.cool=Math.max(1.25,2.25-wave*.02);
      }
    }
    else {e.y+=e.vy*dt;e.x+=Math.sin(e.t*.8+e.phase)*20*dt;if(e.cool<=0){
      for(const ally of enemies){if(!ally.active||ally===e||ally.hp>=ally.maxHp)continue; const d=Math.hypot(ally.x-e.x,ally.y-e.y); if(d<125){ally.hp=Math.min(ally.maxHp,ally.hp+1);spawnParticle(ally.x,ally.y,5,120,.35);break;}}
      e.cool=1.8;
      }
    }
    if(e.y>H+60){e.active=false;activeEnemyCount=Math.max(0,activeEnemyCount-1);}
  }

  for(const b of enemyBullets){
    if(!b.active)continue;
    if(b.homing && b.turn>0){
      const desired=Math.atan2(player.y-b.y,player.x-b.x),current=Math.atan2(b.vy,b.vx);
      let da=desired-current; while(da>Math.PI)da-=Math.PI*2; while(da<-Math.PI)da+=Math.PI*2;
      const turn=Math.max(-b.turn*dt,Math.min(b.turn*dt,da));
      const a=current+turn; const spd=Math.hypot(b.vx,b.vy); b.vx=Math.cos(a)*spd;b.vy=Math.sin(a)*spd;
    }
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0||b.x<-40||b.x>W+40||b.y<-40||b.y>H+40){b.active=false;activeEnemyBulletCount=Math.max(0,activeEnemyBulletCount-1);}
    else{
      const dx=b.x-player.x,dy=b.y-player.y,rr=b.r+player.r;
      if(dx*dx+dy*dy<rr*rr){b.active=false;activeEnemyBulletCount=Math.max(0,activeEnemyBulletCount-1);hitPlayer()}
    }
  }

  // Normal bullets can intercept boss torpedoes. Other attacks intentionally do not
  // damage them, so a torpedo cannot be erased by the phaser or area skills.
  for(const b of bullets){
    if(!b.active)continue;
    let intercepted=false;
    for(const t of bossTorpedoes){
      if(!t.active)continue;
      const dx=b.x-t.x,dy=b.y-t.y,rr=b.r+t.r;
      if(dx*dx+dy*dy<rr*rr){
        b.active=false;
        t.hp-=(b.damage+(overdrive>0?1:0));
        spawnParticle(b.x,b.y,4,35,.35);
        if(t.hp<=0){
          t.active=false;
          spawnParticle(t.x,t.y,18,35,.75);
          shake=Math.max(shake,3.5);
          tone(160,.09,'triangle',.04);
        }
        intercepted=true;
        break;
      }
    }
    if(intercepted)continue;
    for(const e of enemies){
      if(!e.active)continue;const dx=b.x-e.x,dy=b.y-e.y,rr=b.r+e.r;
      if(dx*dx+dy*dy<rr*rr){b.active=false;e.hp-=b.damage+(overdrive>0?1:0);spawnParticle(b.x,b.y,3,190,.5);if(e.hp<=0)explodeEnemy(e);break}
    }
  }

  for(const p of powerups){
    if(!p.active)continue;p.y+=p.vy*dt;p.t+=dt*2;
    const dx=p.x-player.x,dy=p.y-player.y,rr=p.r+player.r;
    if(dx*dx+dy*dy<rr*rr){collectPower(p);continue}
    if(p.y>H+30)p.active=false;
  }

  for(const p of particles){
    if(!p.active)continue;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=p.drag;p.vy*=p.drag;p.life-=dt;p.alpha=Math.max(0,p.life/p.max);
    if(p.life<=0)p.active=false;
  }
  for(const r of rings){
    if(!r.active)continue;r.r+=(r.max-r.r)*dt*11;r.life-=dt;if(r.life<=0)r.active=false;
  }

  if(bossActive){
    boss.t+=dt;
    const cfg=bossConfig(bossStage);
    updateBossPhase();
    bossPhasePulse=Math.max(0,bossPhasePulse-dt);
    if(boss.y<110)boss.y+=cfg.spd*dt;
    if(bossStage===1) boss.x=W/2+Math.sin(boss.t*.75)*W*.24;
    else if(bossStage===2) boss.x=W/2+Math.sin(boss.t*.45)*W*.28;
    else if(bossStage===3) boss.x=W/2+Math.sin(boss.t*.72)*W*.30;
    else if(bossStage===4) boss.x=W/2+Math.sin(boss.t*.25)*W*.22;
    else boss.x=W/2+Math.sin(boss.t*.35)*W*.34;

    bossAtkTimer-=dt;
    if(bossLaser>0){
      bossLaser-=dt;
      if(bossStage===5) bossLaserAngle+=Math.sin(boss.t*1.8)*dt*.35;
    }

    if(bossAtkTimer<=0){
      bossPhase=(bossPhase+1)%8;

      if(bossStage===1){
        if(bossPhase===0){for(let i=0;i<3;i++)directed(boss.x,boss.y,player.x+rand(-28,28),player.y,165+i*25,5)}
        if(bossPhase===1){radial(boss.x,boss.y,12,95,boss.t*.5,4)}
        if(bossPhase===2){for(let i=0;i<3;i++)spawnEnemy(0,clamp(boss.x+rand(-90,90),20,W-20),boss.y+20)}
        if(bossPhase===3){for(let i=0;i<3;i++)setTimeout(()=>{if(bossActive)directed(boss.x,boss.y,player.x,player.y,150,4)},i*120)}
        bossAtkTimer=2.55;
      } else if(bossStage===2){
        if(bossPhase===0){radial(boss.x,boss.y,22,130,boss.t*.8,4);radial(boss.x,boss.y,11,210,-boss.t*.65,3)}
        if(bossPhase===1){for(let a=-.38;a<=.38;a+=.19)enemyShot(boss.x,boss.y,Math.PI/2+a,185,5)}
        if(bossPhase===2){for(let i=0;i<5;i++)spawnEnemy(2,clamp(boss.x+rand(-130,130),20,W-20),boss.y+rand(-20,30))}
        if(bossPhase===3){bossLaser=.78;bossLaserAngle=Math.atan2(player.y-boss.y,player.x-boss.x);bossLaserMode=1}
        bossAtkTimer=2.15;
      } else if(bossStage===3){
        if(bossPhase===0){radial(boss.x,boss.y,26,105,boss.t*.65,4)}
        if(bossPhase===1){for(let i=0;i<6;i++)directed(boss.x,boss.y,player.x+Math.sin(i)*70,player.y,195,4)}
        if(bossPhase===2){for(let i=0;i<3;i++)spawnEnemy(i===0?3:4,clamp(boss.x+rand(-120,120),20,W-20),boss.y+20)}
        if(bossPhase===3){radial(boss.x,boss.y,12,235,-boss.t,5);bossLaser=.55;bossLaserAngle= boss.t*1.7;bossLaserMode=2}
        bossAtkTimer=2.0;
      } else if(bossStage===4){
        if(bossPhase===0){radial(boss.x,boss.y,30,92,boss.t*.45,4)}
        if(bossPhase===1){for(let i=0;i<5;i++)directed(boss.x,boss.y,player.x+rand(-55,55),player.y+rand(-20,20),175,5)}
        if(bossPhase===2){for(let i=0;i<7;i++)spawnEnemy(5,rand(30,W-30),boss.y+rand(-10,50))}
        if(bossPhase===3){bossLaser=.9;bossLaserAngle=Math.atan2(player.y-boss.y,player.x-boss.x);bossLaserMode=3}
        bossAtkTimer=2.25;
      } else {
        if(bossPhase===0){radial(boss.x,boss.y,36,105,boss.t*.9,4);radial(boss.x,boss.y,18,225,-boss.t*.5,3)}
        if(bossPhase===1){for(let i=0;i<8;i++)directed(boss.x,boss.y,player.x+Math.cos(i)*80,player.y+Math.sin(i)*30,210,4)}
        if(bossPhase===2){for(let i=0;i<8;i++)spawnEnemy(i%2?2:4,clamp(boss.x+rand(-140,140),20,W-20),boss.y+rand(-10,35))}
        if(bossPhase===3){bossLaser=1.15;bossLaserAngle=boss.t*.9;bossLaserMode=4}
        bossAtkTimer=1.9;
      }

      // Extra late-stage patterns shared by all bosses. Higher stages fire denser patterns.
      const atkScale=1+Math.min(.95,(bossStage-1)*.11);
      if(bossPhase===4){
        const count=Math.round(7+bossStage*1.3);
        for(let i=0;i<count;i++){
          const a=(i/count)*Math.PI*2 + boss.t*.55;
          enemyShot(boss.x,boss.y,a,105*atkScale,3.5);
        }
        if(bossStage>=3) launchBossTorpedo();
      }else if(bossPhase===5){
        for(let i=0;i<Math.min(9,3+bossStage);i++){
          const spread=(i-(Math.min(9,3+bossStage)-1)/2)*.12;
          directed(boss.x,boss.y,player.x+rand(-40,40),player.y,150+bossStage*13,4);
          if(i%2===0) enemyShot(boss.x,boss.y,Math.PI/2+spread,125+bossStage*10,3);
        }
        launchBossTorpedo();
      }
      // Extra boss patterns: increasingly complex combinations.
      if(bossPhase===6){
        // Crossfire: two aimed streams with a rotating offset.
        const n=4+Math.min(4,bossStage);
        for(let i=0;i<n;i++){
          const off=(i-(n-1)/2)*.10;
          directed(boss.x,boss.y,player.x+Math.cos(boss.t+i)*45,player.y,165+bossStage*11,4);
          enemyShot(boss.x,boss.y,Math.PI/2+off+Math.sin(boss.t)*.12,120+bossStage*9,3.5);
        }
      }else if(bossPhase===7){
        // Final-phase pressure: torpedo + expanding radial burst.
        launchBossTorpedo();
        radial(boss.x,boss.y,12+Math.min(10,bossStage*2),92+bossStage*8,boss.t*.8,3.5);
        if(bossStage>=5) launchBossTorpedo();
      }
      bossAtkTimer=Math.max(.82, bossAtkTimer/(1+Math.min(.58,(bossStage-1)*.060)));
      shake=Math.max(shake,4);
      tone(120+bossStage*18,.06,'triangle',.025);
    }

    // Boss contact + player's attacks. Late bosses can restore a small defensive shield by phase.
    if(bossShield>0){
      const regen=(bossPhaseIndex>=2?3.8:2.1)*dt;
      bossShield=Math.min(bossShieldMax,bossShield+regen);
    }
    for(const b of bullets){
      if(!b.active)continue;const rr=b.r+boss.r;
      if((b.x-boss.x)**2+(b.y-boss.y)**2<rr*rr){
        b.active=false;
        let dmg=b.damage+(overdrive>0?1:0);
        if(bossShield>0){bossShield=Math.max(0,bossShield-dmg);}else{boss.hp=Math.max(0,boss.hp-dmg);}
        spawnParticle(b.x,b.y,4,cfg.kind===5?340:20,.5);
      }
    }

    // special boss laser
    if(bossLaser>0){
      let a=bossLaserAngle;
      if(bossLaserMode===1)a=Math.atan2(player.y-boss.y,player.x-boss.x);
      if(bossLaserMode===2)a=boss.t*1.7;
      if(bossLaserMode===3)a=Math.atan2(player.y-boss.y,player.x-boss.x)+Math.sin(boss.t*4)*.32;
      if(bossLaserMode===4)a=boss.t*.9;
      bossLaserAngle=a;
      const ca=Math.cos(a),sa=Math.sin(a);
      const px=player.x-boss.x,py=player.y-boss.y;
      const proj=px*ca+py*sa,perp=Math.abs(px*sa-py*ca);
      if(bossLaser<.22 && proj>0&&proj<W*1.5&&perp<5+(bossStage*1.2))hitPlayer();
    }

    // Stage-specific orbital hazard for boss 4
    if(bossStage===4){
      for(let k=0;k<3;k++){
        const a=boss.t*(.55+k*.08)+k*Math.PI*2/3;
        const ox=boss.x+Math.cos(a)*(boss.r+26),oy=boss.y+Math.sin(a)*(boss.r+26);
        const dx=player.x-ox,dy=player.y-oy;
        if(dx*dx+dy*dy<(12+player.r)**2)hitPlayer();
      }
    }

    if(boss.hp<=0){
      bossActive=false;boss.visible=false;bossKills++;score+=5000+bossStage*2200+wave*1400;
      bossTimer=score;
      slow=.32;shake=22;flashPower=.8;
      spawnParticle(boss.x,boss.y,220,10,2.4);noise(.5,.08);tone(55+bossStage*8,.8,'sawtooth',.09);
      toastMsg(`${bossName} // DESTROYED`,'#ffcf68',1800);
      if(player.hp<player.maxHp) player.hp++; player.shieldPct=Math.min(100,player.shieldPct+35);player.shieldDelay=0;
      dropPower(boss.x,boss.y,0);dropPower(clamp(boss.x+45,20,W-20),boss.y,1);
      player.power=Math.min(7,player.power+1);
      if(gameMode==='quick'){
        quickBossIndex++;
        if(quickBossIndex>=3){completeRun(true);return;}
        wave=[4,10,25][quickBossIndex];
        waveTime=0;spawnTimer=.35;
        applyQuickLoadout();
        toastMsg(`QUICK PHASE ${quickBossIndex+1} // LOADOUT UPGRADED`,'#7de8ff',1100);
      }else if(gameMode==='normal' && bossKills>=8){
        completeRun(false);return;
      }
      updateHud();
    }
    const br=boss.r+12;
    if((boss.x-player.x)**2+(boss.y-player.y)**2<br*br)hitPlayer();
  }

  score += dt*4;
  updateHud();

  fpsAcc+=dt;fpsFrames++;
  if(fpsAcc>=.5){fps=fpsFrames/fpsAcc;fpsAcc=0;fpsFrames=0;statsEl.textContent=`${fps.toFixed(0)} FPS  •  ENEMIES ${activeEnemyCount}  •  BULLETS ${activeEnemyBulletCount}`}
}

function draw(){
  ctx.save();
  let sx=0,sy=0;if(shake>0){sx=(Math.random()*2-1)*shake;sy=(Math.random()*2-1)*shake}
  ctx.translate(sx,sy);
  // deep gradient
  ctx.fillStyle=bgGradient;ctx.fillRect(-20,-20,W+40,H+40);
  // nebula
  ctx.fillStyle=nebulaGradient;ctx.fillRect(0,0,W,H);

  // stars
  for(const s of stars){
    const yy=s.y*H,xx=s.x*W,sz=.7+s.z*1.8,alpha=.25+s.z*.65;
    ctx.fillStyle=`rgba(185,230,255,${alpha})`;ctx.fillRect(xx,yy,sz,sz*(2+s.z*3));
  }

  // speed lines
  ctx.globalAlpha=.12;
  for(let i=0;i<18;i++){const x=(i*97+time*160)% (W+100)-50;ctx.fillStyle='#7bdcff';ctx.fillRect(x,H*.55,1,70)}
  ctx.globalAlpha=1;

  // boss
  if(bossActive&&boss.visible)drawBoss();
  // enemies
  for(const e of enemies)if(e.active)drawEnemy(e);
  // homing torpedoes
  drawTorpedoes();
  drawBossTorpedoes();
  // enemy bullets
  for(const b of enemyBullets)if(b.active)drawBullet(b,true);
  // player bullets
  for(const b of bullets)if(b.active)drawBullet(b,false);
  // powerups
  for(const p of powerups)if(p.active)drawPower(p);
  // particles
  const liteRender=mobileLite;
  for(const p of particles)if(p.active){ctx.globalAlpha=p.alpha;ctx.fillStyle=`hsla(${p.h},100%,66%,${p.alpha})`;if(!liteRender){ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=5;}ctx.fillRect(p.x-p.size*.5,p.y-p.size*.5,p.size,p.size);if(!liteRender)ctx.shadowBlur=0;}
  ctx.globalAlpha=1;
  // rings
  ctx.lineWidth=2;
  for(const r of rings)if(r.active){ctx.globalAlpha=Math.max(0,r.life/.3);ctx.strokeStyle=`hsla(${r.h},100%,65%,1)`;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke()}
  ctx.globalAlpha=1;

  drawPhaser();
  drawPlayer();
  ctx.restore();

  if(flashPower>0){flash.style.opacity=String(clamp(flashPower,0,1))}
  else flash.style.opacity='0';

  // combo text
  if(combo>=3 && comboTimer>0){
    ctx.save();ctx.textAlign='center';ctx.font=`900 ${Math.min(28,14+combo)}px system-ui`;
    ctx.fillStyle='rgba(130,235,255,.92)';ctx.shadowColor='#49dcff';ctx.shadowBlur=14;
    ctx.fillText(`${combo} COMBO`,W/2,Math.max(120,H*.28));ctx.restore()
  }
}

function glow(){
  ctx.save();ctx.globalCompositeOperation='lighter';
}

function weaponCooldowns(){
  const lateBonus=.1;
  return {
    // Phaser: 1.0s normally, shortened to 0.8s from boss 4 onward.
    phaser: bossStage>=4 ? .8 : 1.0,
    torpedo: wave<11
      ? Math.max(4.35,6.05-player.power*.25)
      : wave<15
        ? Math.max(3.9,5.8-player.power*.25+lateBonus)
        : Math.max(3.35,5.0-player.power*.28+0.05)
  };
}

function weaponUnlocked(){return gameMode==='quick' ? true : wave>=4;}

function findTorpedoTarget(){
  let best=null,bestD=Infinity;
  // Lock only targets that are sufficiently far from the player,
  // preventing the torpedo from trying to detonate right beside the ship.
  const minD=125*125;

  for(const e of enemies){
    if(!e.active) continue;
    const dx=e.x-player.x,dy=e.y-player.y,d2=dx*dx+dy*dy;
    if(d2<minD) continue;
    if(d2<bestD){bestD=d2;best=e}
  }

  if(bossActive){
    const dx=boss.x-player.x,dy=boss.y-player.y,d2=dx*dx+dy*dy;
    if(d2>=minD && d2<bestD*1.35) best=boss;
  }
  return best;
}

function getTorpedoUpgradeStage(){
  // Keep the existing weapon-upgrade milestones.
  // Wave 15: existing Mk-II stats.
  // Wave 20: add a 2-shot burst on top of the existing weapon progression.
  // Wave 25: upgrade that burst to 3 shots; no new milestone is introduced.
  // Quick boss 3 represents the final weapon loadout.
  if(gameMode==='quick'){
    if(quickBossIndex>=2)return 3;
    if(quickBossIndex>=1)return 1;
    return 0;
  }
  if(wave>=25)return 3;
  if(wave>=20)return 2;
  if(wave>=15)return 1;
  return 0;
}

function findTorpedoTargets(count){
  const candidates=[];
  const minD=125*125;
  for(const e of enemies){
    if(!e.active)continue;
    const dx=e.x-player.x,dy=e.y-player.y,d2=dx*dx+dy*dy;
    if(d2<minD)continue;
    const angle=Math.atan2(dy,dx);
    candidates.push({obj:e,d2,angle});
  }
  if(bossActive){
    const dx=boss.x-player.x,dy=boss.y-player.y,d2=dx*dx+dy*dy;
    if(d2>=minD)candidates.push({obj:boss,d2,angle:Math.atan2(dy,dx)});
  }
  candidates.sort((a,b)=>a.d2-b.d2);
  const selected=[];
  const minSep=.20;
  for(const c of candidates){
    let separated=true;
    for(const q of selected){
      let da=c.angle-q.angle;
      while(da>Math.PI)da-=Math.PI*2;
      while(da<-Math.PI)da+=Math.PI*2;
      if(Math.abs(da)<minSep){separated=false;break;}
    }
    if(separated)selected.push(c);
    if(selected.length>=count)break;
  }
  // When there are too few angularly separated targets, keep target uniqueness
  // rather than sending multiple torpedoes into exactly the same target.
  return selected.map(v=>v.obj);
}

function launchTorpedoSingle(target,upgradeStage,lane=0,launchDelay=0){
  if(!target)return false;
  const t=torpedoes.find(v=>!v.active && v.launchDelay<=0);
  if(!t)return false;
  const mk2=upgradeStage>=1;
  const lanePx=lane*12;
  const sx=player.x + (-Math.sin(Math.atan2(target.y-player.y,target.x-player.x)))*lanePx;
  const sy=player.y-12 + Math.cos(Math.atan2(target.y-player.y,target.x-player.x))*lanePx;
  const a=Math.atan2(target.y-sy,target.x-sx) + lane*.055;
  t.active=true;
  t.x=sx;
  t.y=sy;
  t.r=5*GAME_SCALE*FIELD_SCALE;
  t.speed=(215+player.power*7)*(mk2?1.18:1);
  t.vx=Math.cos(a)*t.speed;
  t.vy=Math.sin(a)*t.speed;
  t.turn=(3.4+player.power*.16)+(mk2?1.05:0);
  t.life=mk2?7.6:7;
  t.target=target;
  t.armed=false;
  t.lane=lane;
  t.launchDelay=launchDelay;
  return true;
}

function queueTorpedoBurst(targets,upgradeStage){
  const lanes=targets.length===1?[0]:targets.length===2?[-1,1]:[-1,0,1];
  let queued=0;
  for(let i=0;i<targets.length;i++){
    const t=torpedoes.find(v=>!v.active && v.launchDelay<=0);
    if(!t)break;
    // Store a delayed activation in the pool object itself.
    t.active=true;
    t.x=player.x;t.y=player.y-12;t.vx=0;t.vy=0;t.target=targets[i];
    t.r=5*GAME_SCALE*FIELD_SCALE;t.speed=(215+player.power*7)*(upgradeStage>=1?1.18:1);
    t.turn=(3.4+player.power*.16)+(upgradeStage>=1?1.05:0);
    t.life=upgradeStage>=1?7.6:7;t.armed=false;t.lane=lanes[i];t.launchDelay=i*.15;
    const launchAngle=Math.atan2(targets[i].y-player.y,targets[i].x-player.x);
    const px=(-Math.sin(launchAngle))*lanes[i]*12, py=Math.cos(launchAngle)*lanes[i]*12;
    t.x=player.x+px;t.y=player.y-12+py;
    t.vx=0;t.vy=0;
    queued++;
  }
  return queued;
}

function launchTorpedo(){
  const upgradeStage=getTorpedoUpgradeStage();
  const burstCount=upgradeStage>=3?3:upgradeStage>=2?2:1;
  const targets=findTorpedoTargets(burstCount);
  if(!targets.length)return false;
  const queued=queueTorpedoBurst(targets,upgradeStage);
  if(!queued)return false;
  torpedoFlash=.12;
  spawnParticle(player.x,player.y,10+queued*2,35,.65);
  tone(260+queued*18,.10,'square',.035);
  return true;
}

function explodeTorpedo(t){
  const x=t.x,y=t.y;
  t.active=false;

  // Wave 15+: Mk-II warhead gets a modestly wider blast radius.
  const torpedoMk2 = getTorpedoUpgradeStage()>=1;
  const radius=torpedoMk2?74:62;
  for(const e of enemies){
    if(!e.active)continue;
    const dx=e.x-x,dy=e.y-y,d=Math.hypot(dx,dy);
    if(d<radius){
      const baseDmg=(52+player.power*8)*(torpedoMk2?1.28:1);
      const dmg=Math.max(12,baseDmg-d*(torpedoMk2?.40:.45));
      e.hp-=dmg;
      if(e.hp<=0)explodeEnemy(e);
    }
  }

  if(bossActive){
    const dx=boss.x-x,dy=boss.y-y,d=Math.hypot(dx,dy);
    if(d<radius+boss.r){ const dmg=36+player.power*7; if(bossShield>0)bossShield=Math.max(0,bossShield-dmg); else boss.hp=Math.max(0,boss.hp-dmg); }
  }

  spawnParticle(x,y,34,35,1.1);
  const r=rings.find(v=>!v.active);
  if(r){
    r.active=true;r.x=x;r.y=y;r.r=8;r.max=58;r.life=.34;r.h=38;
  }
  shake=Math.max(shake,4);
  tone(90,.16,'sawtooth',.055);
}

function launchBossTorpedo(){
  if(!bossActive)return false;
  // Only one boss torpedo may exist at a time.
  if(bossTorpedoes.some(v=>v.active))return false;
  const t=bossTorpedoes.find(v=>!v.active);
  if(!t)return false;
  const a=Math.atan2(player.y-boss.y,player.x-boss.x);
  t.active=true;t.x=boss.x;t.y=boss.y+boss.r*.15;
  t.spd=150+bossStage*9;t.turn=1.7+Math.min(1.4,bossStage*.12);t.life=8;t.r=6;
  t.vx=Math.cos(a)*t.spd;t.vy=Math.sin(a)*t.spd;
  // Enemy torpedoes can be destroyed by normal player bullets.
  t.hp=14+Math.max(0,bossStage-1)*2;
  tone(210+bossStage*8,.12,'square',.032);
  spawnParticle(t.x,t.y,8,45,.55);
  return true;
}

function updateBossTorpedoes(dt){
  if(!bossActive){ for(const t of bossTorpedoes)t.active=false; return; }

  // Boss torpedoes are strictly sequential: a new torpedo cannot launch
  // while the previous one is still active. The next launch waits for the
  // existing torpedo to hit, expire, or leave the playfield.
  const activeBossTorpedo=bossTorpedoes.some(t=>t.active);
  if(!activeBossTorpedo){
    bossTorpedoTimer-=dt;
    if(bossTorpedoTimer<=0){
      if(launchBossTorpedo()){
        bossTorpedoTimer=Math.max(1.65,3.4-bossStage*.10);
      }else{
        bossTorpedoTimer=.1;
      }
    }
  }

  for(const t of bossTorpedoes){
    if(!t.active)continue;
    t.life-=dt;
    let dx=player.x-t.x,dy=player.y-t.y;
    const desired=Math.atan2(dy,dx),current=Math.atan2(t.vy,t.vx);
    let da=desired-current;
    while(da>Math.PI)da-=Math.PI*2;
    while(da<-Math.PI)da+=Math.PI*2;
    const turn=Math.max(-t.turn*dt,Math.min(t.turn*dt,da));
    const a=current+turn;
    t.vx=Math.cos(a)*t.spd;t.vy=Math.sin(a)*t.spd;
    t.x+=t.vx*dt;t.y+=t.vy*dt;
    dx=player.x-t.x;dy=player.y-t.y;
    if(dx*dx+dy*dy<(t.r+player.r+2)**2){
      t.active=false;
      player.shieldPct=Math.max(0,player.shieldPct-30);
      player.shieldDelay=2.8;
      player.inv=Math.max(player.inv,.45);
      shake=8;flashPower=.16;
      toastMsg('BOSS TORPEDO // SHIELD -30%','#ff8b6e',700);
      spawnParticle(player.x,player.y,28,35,1.15);
      tone(95,.22,'sawtooth',.06);
      if(player.shieldPct<=0) toastMsg('SHIELD OFFLINE // HP EXPOSED','#ffad72',800);
      updateHud();
    }else if(t.life<=0||t.x<-70||t.x>W+70||t.y<-70||t.y>H+70){
      t.active=false;
    }
  }
}

function updateTorpedoes(dt){
  torpedoFlash=Math.max(0,torpedoFlash-dt);

  if(!weaponUnlocked()){
    torpedoTimer=weaponCooldowns().torpedo;
  }else{
    torpedoTimer-=dt;
    if(torpedoTimer<=0){
      const target=findTorpedoTarget();
      if(target){
        launchTorpedo();
        torpedoTimer=weaponCooldowns().torpedo;
      }else{
        // No enemy: keep the weapon ready instead of spending a cooldown on an empty shot.
        torpedoTimer=0;
      }
    }
  }

  for(const t of torpedoes){
    if(!t.active)continue;
    if(t.launchDelay>0){
      t.launchDelay-=dt;
      if(t.launchDelay>0)continue;
      const target=t.target;
      if(!target || (target!==boss && !target.active)){ t.active=false; continue; }
      const baseAngle=Math.atan2(target.y-t.y,target.x-t.x);
      const angle=baseAngle+t.lane*.055;
      t.vx=Math.cos(angle)*t.speed;
      t.vy=Math.sin(angle)*t.speed;
      spawnParticle(t.x,t.y,5,35,.5);
      tone(320+t.lane*20,.045,'square',.018);
    }
    t.life-=dt;
    const target=t.target;

    if(!target || (target!==boss && !target.active)){
      const nt=findTorpedoTarget();
      if(nt)t.target=nt;
    }

    if(t.target){
      const dx=t.target.x-t.x,dy=t.target.y-t.y;
      const desired=Math.atan2(dy,dx);
      const current=Math.atan2(t.vy,t.vx);
      let da=desired-current;
      while(da>Math.PI)da-=Math.PI*2;
      while(da<-Math.PI)da+=Math.PI*2;
      const turn=Math.max(-t.turn*dt,Math.min(t.turn*dt,da));
      const angle=current+turn;
      t.vx=Math.cos(angle)*t.speed;
      t.vy=Math.sin(angle)*t.speed;

      // Detonate before reaching the target itself.
      // This gives the weapon a small standoff-distance explosion.
      const dist=Math.hypot(dx,dy);
      if(dist<48){
        explodeTorpedo(t);
        continue;
      }
    }

    t.x+=t.vx*dt;t.y+=t.vy*dt;
    if(t.life<=0||t.x<-60||t.x>W+60||t.y<-60||t.y>H+60){
      t.active=false;
    }
  }
}

function drawTorpedoes(){

function drawBossTorpedoes(){

    ctx.fillStyle='#fff0f2';ctx.beginPath();ctx.moveTo(15,0);ctx.lineTo(-8,-5);ctx.lineTo(-10,5);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ff365a';ctx.fillRect(-9,-2,10,4);ctx.restore();

function acquirePhaserTarget(exclude=null){
  let best=null,bestD=Infinity;

  for(const e of enemies){
    if(!e.active || e===exclude)continue;
    const dx=e.x-player.x,dy=e.y-player.y,d2=dx*dx+dy*dy;
    if(d2<bestD){bestD=d2;best=e;}
  }

  if(bossActive && boss!==exclude){
    const dx=boss.x-player.x,dy=boss.y-player.y,bd=dx*dx+dy*dy;
    if(!best || bd<bestD*1.35) best=boss;
  }
  return best;
}

function chanceTwinPhaser(){
  // From wave 20 onward the phaser is permanently upgraded to dual-beam mode.
  // Before that, keep the original rare twin-shot behavior.
  return wave>=20 || Math.random()<0.07;
}

function startPhaserBurst(){
  if(!weaponUnlocked()) return false;
  const target1=acquirePhaserTarget();
  if(!target1)return false;

  phaserTarget=target1;
  phaserActive=.56;
  phaserFlash=.56;
  phaserTick=0;
  phaserJustFired=true;
  phaserTwin=chanceTwinPhaser();

  if(phaserTwin){
    phaserTarget2=acquirePhaserTarget(target1);
  }else{
    phaserTarget2=null;
  }

  phaserAim1=Math.atan2(target1.y-player.y,target1.x-player.x);
  phaserAim2=phaserTarget2
    ? Math.atan2(phaserTarget2.y-player.y,phaserTarget2.x-player.x)
    : phaserAim1;

  tone(phaserTwin?790:720,.08,'square',.035);
  return true;
}

function phaserRayTarget(angle){
  const ox=player.x, oy=player.y;
  const ux=Math.cos(angle), uy=Math.sin(angle);
  let best=null, bestAlong=Infinity;
  for(const t of enemies){
    if(!t.active)continue;
    const dx=t.x-ox, dy=t.y-oy;
    const along=dx*ux+dy*uy;
    if(along<=0)continue;
    const r=Math.max(8,t.r||0);
    const perp=Math.abs(dx*uy-dy*ux);
    if(perp>r)continue;
    const hit=along-Math.sqrt(Math.max(0,r*r-perp*perp));
    if(hit<bestAlong){bestAlong=hit;best=t;}
  }
  if(bossActive && boss && boss.active){
    const dx=boss.x-ox,dy=boss.y-oy;
    const along=dx*ux+dy*uy;
    if(along>0){
      const r=Math.max(8,boss.r||0);
      const perp=Math.abs(dx*uy-dy*ux);
      if(perp<=r){
        const hit=along-Math.sqrt(Math.max(0,r*r-perp*perp));
        if(hit<bestAlong){bestAlong=hit;best=boss;}
      }
    }
  }
  return best;
}

function damagePhaserTarget(target){
  if(!target)return;

  // Wave 25+: stabilized phaser capacitors give a small damage increase.
  const dmg=(7+player.power*3+(overdrive>0?4:0))*(wave>=25?1.18:1);

  if(target===boss){
    if(!boss.active)return;
    if(bossShield>0) bossShield=Math.max(0,bossShield-dmg);
    else boss.hp=Math.max(0,boss.hp-dmg);
  }else{
    if(!target.active)return;
    target.hp-=dmg;
    if(target.hp<=0)explodeEnemy(target);
  }
}

function phaserSweep(a1,a2,radius){
  // Remove enemy projectiles that intersect the beam.
  // This makes the phaser useful defensively without clearing the entire screen.
  const x0=player.x,y0=player.y;
  const cos=Math.cos(a1),sin=Math.sin(a1);
  const maxLen=Math.min(Math.max(W,H)*1.35,radius);

  for(const b of enemyBullets){
    if(!b.active)continue;
    const rx=b.x-x0,ry=b.y-y0;
    const proj=rx*cos+ry*sin;
    if(proj<14 || proj>maxLen)continue;
    const perp=Math.abs(rx*sin-ry*cos);
    if(perp <= 6.5 + b.r*1.5){
      b.active=false;activeEnemyBulletCount=Math.max(0,activeEnemyBulletCount-1);
      spawnParticle(b.x,b.y,2,100,.22);
      spawnParticle(b.x,b.y,2,100,.22);
    }
  }
}

function autoCannonTarget(exclude1=null,exclude2=null){
  let best=null,bestD=Infinity;
  for(const e of enemies){
    if(!e.active || e===exclude1 || e===exclude2)continue;
    const dx=e.x-player.x,dy=e.y-player.y,d2=dx*dx+dy*dy;
    if(d2<bestD){bestD=d2;best=e;}
  }
  if(bossActive && boss && boss.active && boss!==exclude1 && boss!==exclude2){
    const dx=boss.x-player.x,dy=boss.y-player.y,bd=dx*dx+dy*dy;
    if(!best || bd<bestD)best=boss;
  }
  return best;
}

function updateAutoCannon(dt){
  if((gameMode==='quick' && !quickWeaponUnlocked('auto')) || (gameMode!=='quick' && wave<15)){ autoCannonTimer=.45; return; }

  let target1=autoCannonTarget(phaserTarget,phaserTarget2);
  if(!target1){ autoCannonTimer=0.12; return; }
  let target2=autoCannonTarget(phaserTarget,phaserTarget2);
  if(target2===target1)target2=null;

  const targetAngle1=Math.atan2(target1.y-player.y,target1.x-player.x);
  let da1=targetAngle1-autoAim1;
  while(da1>Math.PI)da1-=Math.PI*2;
  while(da1<-Math.PI)da1+=Math.PI*2;
  autoAim1+=da1*Math.min(1,dt*16);

  if(target2){
    const targetAngle2=Math.atan2(target2.y-player.y,target2.x-player.x);
    let da2=targetAngle2-autoAim2;
    while(da2>Math.PI)da2-=Math.PI*2;
    while(da2<-Math.PI)da2+=Math.PI*2;
    autoAim2+=da2*Math.min(1,dt*16);
  }

  autoCannonTimer-=dt;
  if(autoCannonTimer<=0){
    const shots=[target1,target2].filter(Boolean);
    for(let i=0;i<shots.length;i++){
      const angle=i===0?autoAim1:autoAim2;
      const b=acquireBullet(bullets); if(!b)break;
      b.active=true;b.x=player.x;b.y=player.y;
      b.vx=Math.cos(angle)*560;b.vy=Math.sin(angle)*560;
      b.r=3.2*GAME_SCALE*FIELD_SCALE;
      b.damage=player.power>=4?2:1;
      b.kind=3;
    }
    if(shots.length)tone(840+player.power*35,.022,'triangle',.012);
    autoCannonTimer=Math.max(.28,.52-player.power*.025);
  }
}

function updatePhaser(dt){
  phaserFlash=Math.max(0,phaserFlash-dt);
  if(gameMode==='quick' && !quickWeaponUnlocked('phaser')){ phaserActive=0;phaserTarget=null;phaserTarget2=null;phaserTwin=false;phaserTimer=.5;return; }

  if(!weaponUnlocked()){
    phaserActive=0;phaserTarget=null;phaserTarget2=null;phaserTwin=false;phaserJustFired=false;
    phaserTimer=weaponCooldowns().phaser;
    return;
  }

  if(phaserActive>0){
    phaserActive=Math.max(0,phaserActive-dt);

    // Re-acquire a new target immediately when the current one disappears.
    if(!phaserTarget ||
       (phaserTarget!==boss && !phaserTarget.active) ||
       (phaserTarget===boss && !boss.active)){
      phaserTarget=acquirePhaserTarget();
    }

    if(phaserTwin && (!phaserTarget2 ||
       (phaserTarget2!==boss && !phaserTarget2.active) ||
       (phaserTarget2===boss && !boss.active))){
      phaserTarget2=acquirePhaserTarget(phaserTarget);
    }

    // Smoothly turn the beam instead of snapping to the new target.
    if(phaserTarget){
      const desired1=Math.atan2(phaserTarget.y-player.y,phaserTarget.x-player.x);
      let da1=desired1-phaserAim1;
      while(da1>Math.PI)da1-=Math.PI*2;
      while(da1<-Math.PI)da1+=Math.PI*2;
      phaserAim1+=da1*Math.min(1,dt*20);
    }

    if(phaserTwin && phaserTarget2){
      const desired2=Math.atan2(phaserTarget2.y-player.y,phaserTarget2.x-player.x);
      let da2=desired2-phaserAim2;
      while(da2>Math.PI)da2-=Math.PI*2;
      while(da2<-Math.PI)da2+=Math.PI*2;
      phaserAim2+=da2*Math.min(1,dt*20);
    }

    phaserTick-=dt;
    if(phaserTick<=0){
      const hit1=phaserRayTarget(phaserAim1);
      const hit2=phaserTwin ? phaserRayTarget(phaserAim2) : null;
      if(hit1)damagePhaserTarget(hit1);
      if(hit2 && hit2!==hit1)damagePhaserTarget(hit2);

      // The beam stops at the first object physically intersected by its ray.
      const beamLen1=phaserBeamLength(hit1,phaserAim1);
      phaserSweep(phaserAim1,phaserAim1,beamLen1);
      if(phaserTwin)phaserSweep(phaserAim2,phaserAim2,phaserBeamLength(hit2,phaserAim2));

      phaserTick=.09;
      phaserFlash=Math.max(phaserFlash,.10);
    }

    // Cooldown starts only after ALL active beams have completely ended.
    if(phaserActive<=0){
      phaserTarget=null;
      phaserTarget2=null;
      phaserTwin=false;
      phaserTimer=weaponCooldowns().phaser;
      phaserJustFired=false;
    }
    return;
  }

  phaserTimer=Math.max(0,phaserTimer-dt);
  if(phaserTimer<=0)startPhaserBurst();
}




function phaserBeamLength(target,angle){
  const maxLen=Math.min(Math.hypot(W,H)*1.15,Math.max(W,H)*1.45);
  if(!target) return maxLen;
  const ex=player.x,ey=player.y;
  const dx=target.x-ex,dy=target.y-ey;
  const forward=dx*Math.cos(angle)+dy*Math.sin(angle);
  const targetRadius=Math.max(8,target.r||0);
  const perp=Math.abs(dx*Math.sin(angle)-dy*Math.cos(angle));
  if(perp>targetRadius)return clamp(forward,24,maxLen);
  const near=forward-Math.sqrt(Math.max(0,targetRadius*targetRadius-perp*perp));
  return clamp(near-1.5,24,maxLen);
}

function drawPhaserBeam(angle,alpha=1,side=0,target=null){
  // Visual endpoint uses the same first-hit geometry as damage.
  target=phaserRayTarget(angle) || target;
  const emitterX=player.x + (-Math.sin(angle))*side*5;
  const emitterY=player.y + ( Math.cos(angle))*side*5;
  const len=phaserBeamLength(target,angle);
  const tx=emitterX+Math.cos(angle)*len;
  const ty=emitterY+Math.sin(angle)*len;

  ctx.strokeStyle=`rgba(80,210,255,${.26*alpha})`;
  ctx.lineWidth=(8+Math.sin(time*42)*2)*alpha;
  ctx.shadowColor='#54dfff';
  ctx.shadowBlur=22;
  ctx.beginPath();
  ctx.moveTo(emitterX,emitterY);
  ctx.lineTo(tx,ty);
  ctx.stroke();

  ctx.strokeStyle=`rgba(225,255,255,${.96*alpha})`;
  ctx.lineWidth=2.4*alpha;
  ctx.shadowColor='#b9f6ff';
  ctx.shadowBlur=14;
  ctx.beginPath();
  ctx.moveTo(emitterX,emitterY);
  ctx.lineTo(tx,ty);
  ctx.stroke();
}

function drawPhaser(){
  if(phaserActive<=0)return;

  ctx.save();
  ctx.globalCompositeOperation='lighter';

  drawPhaserBeam(phaserAim1,1,0,phaserTarget);

  if(phaserTwin && phaserTarget2){
    drawPhaserBeam(phaserAim2,.82,0,phaserTarget2);
  }

  // Emitter glow.
  ctx.fillStyle='rgba(210,250,255,.95)';
  ctx.shadowColor='#b9f6ff';
  ctx.shadowBlur=24;
  ctx.beginPath();
  ctx.arc(player.x,player.y,5+Math.sin(time*35)*1.4,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}


function drawPlayer(){
  if(player.inv>0 && Math.floor(player.inv*18)%2===0) return;

  ctx.save();
  ctx.translate(player.x,player.y);ctx.scale(PLAYER_SCALE,PLAYER_SCALE);
  ctx.globalCompositeOperation='lighter';

  // engine glow
  const flame = 10 + Math.sin(time*28)*3;
  const fg = ctx.createRadialGradient(0,18,0,0,18,26);
  fg.addColorStop(0,'rgba(120,235,255,.95)');
  fg.addColorStop(.35,'rgba(70,170,255,.45)');
  fg.addColorStop(1,'rgba(40,100,255,0)');
  ctx.fillStyle=fg;
  ctx.beginPath();
  ctx.arc(0,18,flame+14,0,Math.PI*2);
