  // shield
  if(player.shield>0 || player.shieldPct>0){
    const s=player.shieldPct/100;
    const a=.18+.76*s;
    ctx.strokeStyle=`rgba(95,220,255,${a})`;
    ctx.lineWidth=2.6+2.4*s;
    ctx.shadowColor='#59d9ff';
    ctx.shadowBlur=14+22*s;
    ctx.beginPath();
    ctx.arc(0,0,23.5+Math.sin(time*8)*1.6,0,Math.PI*2);
    ctx.stroke();
    // subtle second layer for a stronger Star Trek-like bubble effect
    ctx.strokeStyle=`rgba(180,245,255,${.08+.25*s})`;
    ctx.lineWidth=1.1;
    ctx.shadowBlur=0;
    ctx.beginPath();
    ctx.arc(0,0,27+Math.sin(time*6+1)*1.2,0,Math.PI*2);
    ctx.stroke();
  }

  // ship
  ctx.shadowColor='#65e8ff';
  ctx.shadowBlur=22;
  ctx.fillStyle='#dffcff';
  ctx.beginPath();
  ctx.moveTo(0,-22);
  ctx.lineTo(15,17);
  ctx.lineTo(5,13);
  ctx.lineTo(0,25);
  ctx.lineTo(-5,13);
  ctx.lineTo(-15,17);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle='#42cfff';
  ctx.beginPath();
  ctx.moveTo(0,-16);
  ctx.lineTo(7,10);
  ctx.lineTo(0,6);
  ctx.lineTo(-7,10);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle='#ffffff';
  ctx.beginPath();
  ctx.ellipse(0,-5,5,8,0,0,Math.PI*2);
  ctx.fill();

  // power wings / level indicator
  ctx.strokeStyle=player.power>=3?'#ffd36b':'#7feaff';
  ctx.lineWidth=2;
  ctx.shadowBlur=10;
  ctx.beginPath();
  ctx.moveTo(-13,11); ctx.lineTo(-21,16);
  ctx.moveTo(13,11);  ctx.lineTo(21,16);
  ctx.stroke();

  // hitbox
  ctx.fillStyle='#ff4265';
  ctx.beginPath();
  ctx.arc(0,7,3.5,0,Math.PI*2);
  ctx.fill();

  ctx.shadowBlur=0;
  ctx.restore();
}


function drawBullet(b,enemy){
  ctx.save();ctx.globalCompositeOperation='lighter';
  const len=(enemy?10:(b.kind===3?14:16))*GAME_SCALE*FIELD_SCALE;
  const a=Math.atan2(b.vy,b.vx);
  ctx.translate(b.x,b.y);ctx.rotate(a);
  ctx.shadowBlur=mobileLite?6:14;ctx.shadowColor=enemy?'#ff496c':'#72e6ff';
  ctx.fillStyle=enemy?'#ff5771':'#dfffff';ctx.fillRect(-len*.5,-b.r*.5,len,b.r);
  ctx.restore();
}

function drawEnemy(e){
  ctx.save();ctx.translate(e.x,e.y);ctx.scale(GAME_SCALE*FIELD_SCALE,GAME_SCALE*FIELD_SCALE);ctx.rotate(Math.sin(e.t*1.8+e.phase)*.18);ctx.globalCompositeOperation='lighter';
  const col=e.type===1?'#ff8b44':e.type===2?'#b76bff':e.type===3?'#ffd04f':e.type===4?'#ff5e8c':e.type===5?'#58f0bf':'#4e8cff';
  ctx.shadowBlur=mobileLite?10:18;ctx.shadowColor=col;ctx.fillStyle=col;
  if(e.type===1){
    ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(17,-5);ctx.lineTo(12,16);ctx.lineTo(0,22);ctx.lineTo(-12,16);ctx.lineTo(-17,-5);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff1c9';ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();
  }else if(e.type===2){
    ctx.rotate(Math.PI/4);ctx.fillRect(-9,-9,18,18);ctx.fillStyle='#fee6ff';ctx.fillRect(-3,-3,6,6);
  }else if(e.type===3){
    ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1a1820';ctx.fillRect(-4,-4,8,8);
    ctx.strokeStyle='#fff1a8';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,19+Math.sin(e.t*8)*2,0,Math.PI*2);ctx.stroke();
  }else if(e.type===4){
    ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(13,-4);ctx.lineTo(17,12);ctx.lineTo(0,7);ctx.lineTo(-17,12);ctx.lineTo(-13,-4);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ffd6e5';ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();
  }else if(e.type===5){
    ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#d7fff3';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,22,e.t*2,e.t*2+1.7);ctx.stroke();
  }else if(e.type===6){
    ctx.beginPath();ctx.moveTo(0,-21);ctx.lineTo(8,14);ctx.lineTo(0,9);ctx.lineTo(-8,14);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#fff1a8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-11,0);ctx.lineTo(11,0);ctx.stroke();
  }else if(e.type===7){
    ctx.fillRect(-13,-8,26,16);ctx.fillStyle='#ffe6eb';ctx.fillRect(-5,-3,10,6);
    ctx.fillStyle='#ff4968';ctx.fillRect(-18,-3,5,6);
  }else if(e.type===8){
    ctx.beginPath();ctx.arc(0,0,15,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#c8fff0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,22,time,time+4.5);ctx.stroke();
    ctx.fillStyle='#8affcf';ctx.beginPath();ctx.arc(0,0,5+Math.sin(e.t*7)*1.5,0,Math.PI*2);ctx.fill();
  }else{
    ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(13,7);ctx.lineTo(0,3);ctx.lineTo(-13,7);ctx.closePath();ctx.fill();
    ctx.fillStyle='#d9fbff';ctx.fillRect(-2,-9,4,17);
  }
  ctx.shadowBlur=0;ctx.restore();
}
function drawPower(p){
  ctx.save();ctx.translate(p.x,p.y);ctx.scale(GAME_SCALE*FIELD_SCALE,GAME_SCALE*FIELD_SCALE);ctx.rotate(p.t);
  const color=p.type===0?'#72eaff':p.type===1?'#b294ff':'#ffd15f';
  ctx.globalCompositeOperation='lighter';ctx.shadowBlur=20;ctx.shadowColor=color;
  ctx.fillStyle=color;ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='#07101e';ctx.font='900 10px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.type===0?'P':p.type===1?'S':'B',0,1);
  ctx.restore();
}

function drawBoss(){
  const cfg=bossConfig(bossStage);
  ctx.save();ctx.translate(boss.x,boss.y);ctx.scale(GAME_SCALE*FIELD_SCALE,GAME_SCALE*FIELD_SCALE);ctx.globalCompositeOperation='lighter';
  const pulse=1+Math.sin(time*2.8)*.035;
  ctx.scale(pulse,pulse);
  ctx.shadowBlur=38;ctx.shadowColor=cfg.color;
  if(bossPhasePulse>0){
    ctx.strokeStyle=`rgba(255,210,225,${bossPhasePulse*.75})`;ctx.lineWidth=3+bossPhasePulse*6;
    ctx.beginPath();ctx.arc(0,0,boss.r+10+bossPhasePulse*18,0,Math.PI*2);ctx.stroke();
  }
  if(bossStage===1){
    ctx.fillStyle='#082a3a';ctx.beginPath();ctx.arc(0,0,boss.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#64ddff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,boss.r-2,0,Math.PI*2);ctx.stroke();
    for(let i=0;i<4;i++){const a=time*.7+i*Math.PI/2;ctx.strokeStyle='#c4f6ff';ctx.beginPath();ctx.moveTo(Math.cos(a)*16,Math.sin(a)*16);ctx.lineTo(Math.cos(a)*(boss.r-8),Math.sin(a)*(boss.r-8));ctx.stroke()}
    ctx.fillStyle='#ecffff';ctx.beginPath();ctx.arc(0,0,18+Math.sin(time*7)*2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#4ed7ff';ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill();
  }else if(bossStage===2){
    ctx.fillStyle='#4a1b07';ctx.beginPath();ctx.arc(0,0,boss.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#ffae52';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,boss.r,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='#ffe0a4';ctx.lineWidth=2;
    for(let i=0;i<6;i++){const a=time*.35+i*Math.PI/3;ctx.beginPath();ctx.moveTo(Math.cos(a)*22,Math.sin(a)*22);ctx.lineTo(Math.cos(a)*(boss.r-4),Math.sin(a)*(boss.r-4));ctx.stroke()}
    ctx.fillStyle='#fff2c7';ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff7a2f';ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();
  }else if(bossStage===3){
    ctx.fillStyle='#241033';ctx.beginPath();ctx.arc(0,0,boss.r,0,Math.PI*2);ctx.fill();
    for(let i=0;i<3;i++){
      const a=time*.45+i*Math.PI*2/3;
      ctx.strokeStyle=i===0?'#df7cff':'#7f58ff';ctx.lineWidth=4;
      ctx.beginPath();ctx.arc(Math.cos(a)*boss.r*.45,Math.sin(a)*boss.r*.45,boss.r*.34,0,Math.PI*2);ctx.stroke();
    }
    ctx.fillStyle='#fff1ff';ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#8d4cff';ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();
  }else if(bossStage===4){
    ctx.fillStyle='#041f1a';ctx.beginPath();ctx.arc(0,0,boss.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#61ffd5';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,boss.r-3,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='#b6fff0';ctx.lineWidth=2;
    for(let i=0;i<3;i++){const a=time*.55+i*Math.PI*2/3;ctx.beginPath();ctx.arc(Math.cos(a)*boss.r*.55,Math.sin(a)*boss.r*.55,12,0,Math.PI*2);ctx.stroke()}
    ctx.fillStyle='#00120f';ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#7dffde';ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.stroke();
  }else{
    ctx.fillStyle='#35101d';ctx.beginPath();ctx.arc(0,0,boss.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#ff5b7d';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,boss.r-2,0,Math.PI*2);ctx.stroke();
    for(let i=0;i<8;i++){const a=time*.25+i*Math.PI/4;ctx.fillStyle=i%2?'#ff7b94':'#ffcf72';ctx.beginPath();ctx.moveTo(Math.cos(a)*18,Math.sin(a)*18);ctx.lineTo(Math.cos(a+0.16)*(boss.r-6),Math.sin(a+0.16)*(boss.r-6));ctx.lineTo(Math.cos(a-0.16)*(boss.r-6),Math.sin(a-0.16)*(boss.r-6));ctx.closePath();ctx.fill()}
    ctx.fillStyle='#fff0f3';ctx.beginPath();ctx.arc(0,0,23,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff3159';ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fill();
  }
  ctx.shadowBlur=0;ctx.restore();

  if(bossShield>0){
    const sr=clamp(bossShield/Math.max(1,bossShieldMax),0,1);
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle=`rgba(120,240,255,${.18+.52*sr})`;ctx.lineWidth=2.2+2*sr;ctx.shadowColor='#7fefff';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(boss.x,boss.y,boss.r+7+Math.sin(time*5)*1.2,0,Math.PI*2);ctx.stroke();ctx.restore();
  }

  if(bossStage===4){
    for(let k=0;k<3;k++){
      const a=time*(.55+k*.08)+k*Math.PI*2/3;
      const ox=boss.x+Math.cos(a)*(boss.r+26),oy=boss.y+Math.sin(a)*(boss.r+26);
      ctx.save();ctx.translate(ox,oy);ctx.globalCompositeOperation='lighter';ctx.shadowColor='#64ffd9';ctx.shadowBlur=14;
      ctx.fillStyle='#aaffef';ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill();ctx.restore();
    }
  }

  if(bossLaser>0){
    ctx.save();ctx.globalCompositeOperation='lighter';
    const a=bossLaserAngle;ctx.translate(boss.x,boss.y);ctx.rotate(a);
    const pulse=0.55+0.3*Math.sin(time*22);
    ctx.fillStyle=`rgba(255,70,130,${bossLaser<.22?.9:.11})`;ctx.fillRect(0,-(3+bossStage),W*1.5,6+bossStage*2);
    ctx.fillStyle=`rgba(255,238,245,${pulse})`;ctx.fillRect(0,-1,W*1.5,2);
    ctx.restore();
  }
}

function syncSettingsUI(){
  const pct=Math.round(touchSensitivity*100);
  sensitivityValue.textContent=pct+'%';
  sensitivityRange.value=String(clamp(Math.round(pct/5)*5, Number(sensitivityRange.min), Number(sensitivityRange.max)));
  vibrationValue.textContent=vibrationEnabled?'ON':'OFF';
  liteValue.textContent=lightweightOverride?'LIGHT':'AUTO';
}
function vibrate(ms=24){ if(vibrationEnabled && navigator.vibrate) navigator.vibrate(ms); }
function vibrateStrong(){ if(vibrationEnabled && navigator.vibrate) navigator.vibrate([28,18,45]); }
function openPause(){
  if(!running || gameOver)return;
  paused=true;last=performance.now();pauseOverlay.style.display='flex';touchId=null;syncSettingsUI();
}
function closePause(){
  if(!paused)return;
  paused=false;last=performance.now();pauseOverlay.style.display='none';
}
let pointerLastX=0,pointerLastY=0;
function pointerPosition(e){
  const r=canvas.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  if(touchId===e.pointerId){
    const dx=x-pointerLastX, dy=y-pointerLastY;
    targetX=clamp(targetX+dx*touchSensitivity,20,W-20);
    targetY=clamp(targetY+dy*touchSensitivity,H*.46,H-28);
  }
  pointerLastX=x;pointerLastY=y;
}
canvas.addEventListener('pointerdown',e=>{
  if(!running)return;
  touchId=e.pointerId;
  const r=canvas.getBoundingClientRect();
  pointerLastX=e.clientX-r.left;pointerLastY=e.clientY-r.top;
  canvas.setPointerCapture?.(e.pointerId);activateAudio();
});
canvas.addEventListener('pointermove',e=>{if(e.pointerId===touchId)pointerPosition(e)});
canvas.addEventListener('pointerup',e=>{if(e.pointerId===touchId)touchId=null});
canvas.addEventListener('pointercancel',e=>{if(e.pointerId===touchId)touchId=null});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

addEventListener('keydown',e=>{
  if(e.key==='Escape' && running){ paused ? closePause() : openPause(); return; }
  if(paused)return;
  if(e.key===' '){e.preventDefault();if(running)useBomb()}
  if(e.key==='ArrowLeft')targetX-=35;if(e.key==='ArrowRight')targetX+=35;
  if(e.key==='ArrowUp')targetY-=35;if(e.key==='ArrowDown')targetY+=35;
  targetX=clamp(targetX,20,W-20);targetY=clamp(targetY,H*.46,H-28);
});

skillPhaseBtn.addEventListener('click',e=>{e.stopPropagation();activateAudio();skillPhase();});
skillNovaBtn.addEventListener('click',e=>{e.stopPropagation();activateAudio();skillNova();});
skillOverBtn.addEventListener('click',e=>{e.stopPropagation();activateAudio();skillOverdrive();});


pauseBtn.addEventListener('click',e=>{e.stopPropagation();activateAudio();openPause();vibrateStrong()});
resumeBtn.addEventListener('click',e=>{e.stopPropagation();closePause();vibrate(18)});
restartBtn.addEventListener('click',e=>{e.stopPropagation();pauseOverlay.style.display='none';paused=false;reset();running=true;gameOver=false;last=performance.now();modeButtons.forEach(b=>b.disabled=true);applyQuickLoadout();toastMsg('RESTART','#7de8ff',600);});
sensitivityRange.addEventListener('input',()=>{touchSensitivity=Number(sensitivityRange.value)/100;syncSettingsUI()});
vibrationBtn.addEventListener('click',()=>{vibrationEnabled=!vibrationEnabled;syncSettingsUI();vibrate(28)});
liteBtn.addEventListener('click',()=>{lightweightOverride=!lightweightOverride;mobileLite=innerWidth<=700||lightweightOverride;syncSettingsUI()});

modeButtons.forEach(btn=>btn.addEventListener('click',()=>setMode(btn.dataset.mode)));
startBtn.addEventListener('click',()=>{
  activateAudio();
  reset();
  mobileLite=innerWidth<=700||lightweightOverride;
  running=true;gameOver=false;last=performance.now();overlay.style.display='none';
  modeButtons.forEach(b=>b.disabled=true);
  applyQuickLoadout();
  toastMsg(gameMode==='quick'?'QUICK DEPLOY':gameMode==='endless'?'ENDLESS ENGAGE':'ENGAGE','#7de8ff',700);
  requestAnimationFrame(loop);
});
setMode('normal');

function completeRun(quick){
  gameOver=true;running=false;
  const oldHs=getEndlessHighScore();
  newHighScore=false;
  if(gameMode==='endless' && score>oldHs){
    try{localStorage.setItem(ENDLESS_HS_KEY,String(Math.floor(score)));newHighScore=true;}catch(e){}
  }
  overlay.style.display='flex';
  title.textContent=quick?'QUICK CLEAR':'MISSION CLEAR';
  const suffix=newHighScore?'<br><span style="color:#ffdf78">NEW ENDLESS HIGH SCORE</span>':'';
  desc.innerHTML=`${quick?'3体のボスを撃破しました。':'8体すべてのボスを撃破しました。'}<br><b>SCORE ${Math.floor(score).toLocaleString('ja-JP')}</b>${suffix}<br><br>${!quick?'ENDLESSモードでは8体目以降も継続します。':''}`;
  startBtn.textContent='BACK TO MODE SELECT';
  modeButtons.forEach(b=>b.disabled=false);
  highScoreEl.textContent=`ENDLESS HIGH SCORE: ${getEndlessHighScore().toLocaleString('ja-JP')}`;
}
function endGame(){
  gameOver=true;running=false;
  const oldHs=getEndlessHighScore();
  newHighScore=false;
  if(gameMode==='endless' && score>oldHs){
    try{localStorage.setItem(ENDLESS_HS_KEY,String(Math.floor(score)));newHighScore=true;}catch(e){}
  }
  overlay.style.display='flex';title.textContent='MISSION FAILED';
  const suffix=newHighScore?'<br><span style="color:#ffdf78">NEW ENDLESS HIGH SCORE</span>':'';
  desc.innerHTML=`SCORE <b>${Math.floor(score).toLocaleString('ja-JP')}</b>${suffix}<br>到達 WAVE ${wave}<br><br>${gameMode==='endless'?'ENDLESS HIGH SCORE: '+getEndlessHighScore().toLocaleString('ja-JP'):''}`;
  startBtn.textContent='RESTART';
  highScoreEl.textContent=`ENDLESS HIGH SCORE: ${getEndlessHighScore().toLocaleString('ja-JP')}`;
  modeButtons.forEach(b=>b.disabled=false);
  spawnParticle(player.x,player.y,80,350,1.7);shake=14;flashPower=.8;noise(.35,.06);tone(70,.5,'sawtooth',.07);
}

function loop(ts){
  if(!running)return;
  let dt=(ts-last)/1000||.016;last=ts;dt=Math.min(dt,.045);
  try{
    if(!paused) update(dt);
    draw();
  }catch(err){
    console.error('STARFALL runtime error:',err);
    // Keep the game alive; skip only this frame.
  }
  if(running)requestAnimationFrame(loop)
}
reset();draw();

})();
</script>
</body>
